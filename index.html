<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1E1610">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<title>原木カウンター</title>
<style>
  :root{
    --bark:#1E1610;
    --bark-2:#2C2117;
    --sawn:#E9DCC4;
    --sawn-dim:#A2937B;
    --paint:#FF5A1F;
    --paint-ink:#1E1610;
    --line:#463527;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bark);color:var(--sawn);
    font-family:"Roboto","Noto Sans JP",system-ui,sans-serif;}
  #stage{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  #count{
    position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;
    background:rgba(30,22,16,.82);border:1px solid var(--line);border-radius:14px;
    padding:6px 14px 8px;display:flex;align-items:baseline;gap:8px;backdrop-filter:blur(6px);
  }
  #count b{font-size:38px;line-height:1;font-weight:800;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;color:var(--paint);transition:color .15s;}
  #count span{font-size:13px;color:var(--sawn-dim);letter-spacing:.08em;}
  /* 右上：電卓ボタンと版の表示を並べる */
  #topRight{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;
    display:flex;align-items:center;gap:8px;}
  #calcBtn{background:rgba(30,22,16,.8);border:1px solid var(--line);color:var(--sawn);
    border-radius:9px;padding:5px 7px;line-height:0;backdrop-filter:blur(6px);}
  #calcBtn svg{width:20px;height:20px;display:block;}
  #calcBtn.on{border-color:var(--paint);color:var(--paint);background:#3A2C1F;}
  body.erasing #count{top:calc(38px + env(safe-area-inset-top));}
  #ver{font-size:11px;color:var(--sawn-dim);background:rgba(30,22,16,.8);
    border:1px solid var(--line);border-radius:8px;padding:3px 8px;letter-spacing:.05em;
    backdrop-filter:blur(6px);white-space:nowrap;}

  #empty{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;}
  #empty h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em;}
  #empty p{margin:0;font-size:14px;line-height:1.8;color:var(--sawn-dim);}
  .big{background:var(--paint);color:var(--paint-ink);border:none;border-radius:999px;
    font-size:17px;font-weight:700;padding:16px 30px;}

  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(30,22,16,.96),rgba(30,22,16,.6));}
  #bar button{flex:1 1 21%;background:var(--bark-2);color:var(--sawn);border:1px solid var(--line);
    border-radius:12px;padding:9px 2px 8px;font-size:11px;line-height:1.3;font-weight:600;}
  #bar button:active{background:#3A2C1F;}
  #bar button i{display:block;font-size:18px;font-style:normal;margin-bottom:1px;}

  #savePanel{position:fixed;left:8px;right:8px;bottom:150px;
    background:rgba(38,30,22,.97);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px 16px;backdrop-filter:blur(8px);}
  #saveMsg{font-size:12px;line-height:1.6;color:var(--sawn-dim);margin-bottom:12px;}
  #autoPanel{position:fixed;left:8px;right:8px;bottom:150px;
    background:rgba(38,30,22,.97);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px 16px;backdrop-filter:blur(8px);}
  #autoMsg{font-size:13px;line-height:1.6;color:var(--sawn);margin-bottom:12px;}
  #autoMsg b{color:var(--paint);font-size:17px;}
  .act{flex:1;background:var(--paint);color:var(--paint-ink);border:none;border-radius:10px;
    padding:12px 4px;font-size:13px;font-weight:700;}
  .act.ghost{background:var(--bark-2);color:var(--sawn-dim);border:1px solid var(--line);flex:0 0 80px;}
  .sub{flex:1;background:none;color:var(--sawn-dim);border:1px dashed var(--line);
    border-radius:10px;padding:9px 4px;font-size:11.5px;}
  .sub:active{color:#00C6FF;border-color:#2A5A6B;}
  .act.ghost2{background:var(--bark-2);color:#00C6FF;border:1px solid #2A5A6B;}
  #guessVal{width:46px;text-align:right;font-size:12px;color:var(--sawn-dim);}
  #confBtns{flex:1;display:flex;gap:6px;}
  #confHint{font-size:11px;color:var(--sawn-dim);margin-top:7px;padding-left:64px;line-height:1.5;}
  .confBtn{flex:1;background:var(--bark-2);color:var(--sawn-dim);border:1px solid var(--line);
    border-radius:9px;padding:11px 2px;font-size:14px;font-weight:600;}
  .confBtn.on{background:var(--paint);color:var(--paint-ink);border-color:var(--paint);}
  #bar button.on{border-color:var(--paint);color:var(--paint);}
  #bar button.erasing{background:#7A1D12;border-color:#FF6B4A;color:#FFD9CF;}
  #eraseBanner{position:fixed;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;
    background:#7A1D12;color:#FFE3DA;font-size:12px;text-align:center;font-weight:600;letter-spacing:.04em;}
  #roiBanner{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;
    background:rgba(4,34,43,.96);color:#EAF7FB;backdrop-filter:blur(6px);}
  #roiMsg{font-size:13px;font-weight:700;text-align:center;line-height:1.5;}
  #roiCount{font-size:11.5px;color:#7FDCEF;text-align:center;margin-top:4px;font-variant-numeric:tabular-nums;}
  #roiBanner .act{padding:10px 4px;font-size:12px;}
  #roiBanner .act:disabled{opacity:.4;}

  /* 見た目パネル */
  #panel{position:fixed;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom));
    background:rgba(38,30,22,.97);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px 16px;backdrop-filter:blur(8px);}
  /* 電卓。荷台ごとの本数を足したい時などに使う */
  #calcPanel{position:fixed;left:8px;right:8px;bottom:150px;
    background:rgba(38,30,22,.97);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px 16px;backdrop-filter:blur(8px);max-width:420px;margin:0 auto;}
  #calcTop{display:flex;align-items:center;gap:10px;}
  #calcHistBtn{flex:none;background:var(--bark-2);color:var(--sawn-dim);
    border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:12px;font-weight:600;}
  #calcHistBtn.on{color:var(--paint);border-color:var(--paint);}
  #calcExpr{flex:1;text-align:right;font-size:12px;color:var(--sawn-dim);min-height:18px;
    font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;}
  /* 履歴。押すと数字を打ち直さずに続きから計算できる */
  #calcHist{max-height:246px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
  #calcHist .hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    background:var(--bark-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font-variant-numeric:tabular-nums;width:100%;text-align:left;}
  #calcHist .hrow .he{font-size:12px;color:var(--sawn-dim);overflow:hidden;white-space:nowrap;}
  #calcHist .hrow .hr{font-size:17px;font-weight:700;color:var(--sawn);flex:none;}
  #calcHist .empty{color:var(--sawn-dim);font-size:12px;text-align:center;padding:26px 0;}
  #calcHist .clear{background:none;border:1px dashed var(--line);color:var(--sawn-dim);
    border-radius:10px;padding:9px 4px;font-size:11.5px;}
  #calcDisp{text-align:right;font-size:34px;font-weight:800;color:var(--sawn);
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:12px;
    overflow:hidden;white-space:nowrap;}
  #calcKeys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .ck{background:var(--bark-2);color:var(--sawn);border:1px solid var(--line);
    border-radius:11px;padding:13px 2px;font-size:19px;font-weight:600;
    font-variant-numeric:tabular-nums;}
  .ck:active{background:#3A2C1F;}
  .ck.op{color:var(--paint);}
  .ck.fn{color:var(--sawn-dim);font-size:16px;}
  .ck.eq{background:var(--paint);color:var(--paint-ink);border-color:var(--paint);
    grid-row:span 2;}
  .ck.wide{grid-column:span 2;}

  /* パネル上部の摘み。タップするか、下へ引き下げると閉じる */
  .grab{height:26px;margin:-12px -16px 2px;display:flex;align-items:center;
    justify-content:center;touch-action:none;cursor:grab;}
  .grab::before{content:'';width:46px;height:5px;border-radius:3px;
    background:var(--line);transition:background .15s,width .15s;}
  .grab.hot::before{background:var(--paint);width:56px;}
  .row{display:flex;align-items:center;gap:12px;}
  .row+.row{margin-top:14px;}
  .lab{font-size:12px;color:var(--sawn-dim);width:52px;flex:none;letter-spacing:.06em;}
  #swatches{display:flex;gap:10px;flex:1;}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;flex:none;padding:0;}
  .sw[aria-pressed="true"]{border-color:var(--sawn);box-shadow:0 0 0 3px rgba(233,220,196,.18);}
  input[type=range]{flex:1;accent-color:var(--paint);height:34px;}
  #preview{width:44px;flex:none;display:flex;align-items:center;justify-content:center;}
  #togNum,#togSnd{background:var(--bark-2);color:var(--sawn-dim);border:1px solid var(--line);
    border-radius:999px;padding:8px 16px;font-size:12px;font-weight:600;}
  #togNum.on,#togSnd.on{color:var(--paint);border-color:var(--paint);}

  /* 写真の上に少しの間だけ出る知らせ。どんな写真の上でも読めるよう帯を敷く */
  #hint{position:fixed;left:0;right:0;bottom:88px;text-align:center;font-size:12px;
    color:var(--sawn-dim);pointer-events:none;transition:opacity .4s;padding:0 10px;}
  #hint span{display:inline-block;background:rgba(30,22,16,.94);border:1px solid var(--line);
    border-radius:999px;padding:7px 15px;line-height:1.5;max-width:100%;
    backdrop-filter:blur(6px);}
  #busy{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(30,22,16,.7);font-size:14px;color:var(--sawn-dim);}
  input[type=file]{display:none;}
  .hide{display:none !important;}
  :focus-visible{outline:2px solid var(--paint);outline-offset:2px;}
</style>
</head>
<body>

<div id="stage"><canvas id="cv"></canvas></div>

<div id="count" class="hide"><b id="num">0</b><span>本</span></div>

<div id="topRight">
  <button id="calcBtn" aria-label="電卓を開く">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="5" y="2.5" width="14" height="19" rx="2.5"/>
      <line x1="8.5" y1="6.8" x2="15.5" y2="6.8"/>
      <circle cx="9.2" cy="11.6" r="1.15" fill="currentColor" stroke="none"/>
      <circle cx="14.8" cy="11.6" r="1.15" fill="currentColor" stroke="none"/>
      <circle cx="9.2" cy="16.4" r="1.15" fill="currentColor" stroke="none"/>
      <circle cx="14.8" cy="16.4" r="1.15" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <div id="ver"></div>
</div>

<div id="empty">
  <h1>原木カウンター</h1>
  <p>写真を選んで、木口を指でタップ。<br>タップした数がそのまま本数になります。</p>
  <button class="big" id="pickBig">写真を選ぶ</button>
</div>

<div id="hint" class="hide">2本指で拡大・移動／消すときは「消す」をオンに</div>

<div id="panel" class="hide">
  <div class="grab" aria-label="つまんで下げると閉じます"></div>
  <div class="row">
    <span class="lab">色</span>
    <div id="swatches"></div>
  </div>
  <div class="row">
    <span class="lab">大きさ</span>
    <input type="range" id="size" min="8" max="36" step="1" value="15">
    <span id="preview"></span>
  </div>
  <div class="row">
    <span class="lab">番号</span>
    <button id="togNum" class="on">番号を表示する</button>
  </div>
  <div class="row">
    <span class="lab">音</span>
    <button id="togSnd" class="on">タップ音を鳴らす</button>
  </div>
</div>

<div id="bar" class="hide">
  <button id="pick"><i>🖼</i>写真</button>
  <button id="auto"><i>🤖</i>自動</button>
  <button id="undo"><i>↩</i>戻す</button>
  <button id="erase"><i>🧽</i>消す</button>
  <button id="fit"><i>⤢</i>全体</button>
  <button id="look"><i>🎨</i>見た目</button>
  <button id="save"><i>⬇</i>保存</button>
  <button id="clear"><i>✕</i>全消去</button>
</div>

<div id="autoPanel" class="hide">
  <div class="grab" aria-label="つまんで下げると閉じます"></div>
  <div id="autoMsg">だいたいの本数を合わせて「数える」を押してください。</div>
  <div class="row hide" id="aiRow">
    <span class="lab">数え方</span>
    <div id="confBtns"></div>
  </div>
  <div class="hide" id="confHint">抜けが多い時は「多め」、余分が多い時は「少なめ」</div>
  <div class="row" id="guessRow">
    <span class="lab">本数</span>
    <input type="range" id="guess" min="5" max="300" step="1" value="40">
    <span id="guessVal">40本</span>
  </div>
  <div class="row" style="gap:8px">
    <button id="redo" class="act">数える</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button id="roiBtn" class="sub">範囲を囲う</button>
    <button id="roiAll" class="sub hide">範囲を解除</button>
  </div>
</div>

<div id="savePanel" class="hide">
  <div class="grab" aria-label="つまんで下げると閉じます"></div>
  <div id="saveMsg">保存の種類を選んでください。</div>
  <div class="row" style="gap:8px">
    <button id="savePng" class="act">画像を保存</button>
  </div>
  <div class="row" style="gap:8px">
    <button id="saveData" class="act ghost2">学習データを保存</button>
  </div>
</div>

<div id="calcPanel" class="hide">
  <div class="grab" aria-label="つまんで下げると閉じます"></div>
  <div id="calcTop">
    <button id="calcHistBtn">履歴</button>
    <div id="calcExpr">&nbsp;</div>
  </div>
  <div id="calcDisp">0</div>
  <div id="calcHist" class="hide"></div>
  <div id="calcKeys">
    <button class="ck fn" data-k="C">C</button>
    <button class="ck fn" data-k="back">⌫</button>
    <button class="ck fn" data-k="/">÷</button>
    <button class="ck op" data-k="*">×</button>
    <button class="ck" data-k="7">7</button>
    <button class="ck" data-k="8">8</button>
    <button class="ck" data-k="9">9</button>
    <button class="ck op" data-k="-">−</button>
    <button class="ck" data-k="4">4</button>
    <button class="ck" data-k="5">5</button>
    <button class="ck" data-k="6">6</button>
    <button class="ck op" data-k="+">＋</button>
    <button class="ck" data-k="1">1</button>
    <button class="ck" data-k="2">2</button>
    <button class="ck" data-k="3">3</button>
    <button class="ck eq" data-k="=">＝</button>
    <button class="ck wide" data-k="0">0</button>
    <button class="ck" data-k=".">.</button>
  </div>
</div>

<div id="eraseBanner" class="hide">消すモード：消したい印をタップ</div>
<div id="roiBanner" class="hide">
  <div id="roiMsg">写真の上を指でタップして、範囲の角を順番に囲んでください</div>
  <div id="roiCount">0点</div>
  <div class="row" style="gap:6px;margin-top:8px">
    <button id="roiUndo" class="act ghost" disabled>1つ戻す</button>
    <button id="roiFinish" class="act" disabled>この範囲に決定</button>
    <button id="roiCancel" class="act ghost">やめる</button>
  </div>
</div>
<div id="busy" class="hide">写真を読み込み中…</div>
<input type="file" id="file" accept="image/*">

<script>
/* 画面の隅に出す版の表示。sw.js の CACHE の番号と必ず揃えること。
   ここを直し忘れると、中身が新しくても古い版に見えてしまう。 */
const APP_VER='v23';
document.getElementById('ver').textContent=APP_VER+' AI';

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const fileInput=document.getElementById('file');
const bar=document.getElementById('bar'), emptyBox=document.getElementById('empty');
const countBox=document.getElementById('count'), numEl=document.getElementById('num');
const hint=document.getElementById('hint'), panel=document.getElementById('panel');
const busy=document.getElementById('busy');

let img=null, curURL=null, marks=[], view={s:1,x:0,y:0};
let showNums=true, markR=15, markColor='#FF5A1F', dpr=1;
let fitS=1, soundOn=true, ac=null, eraseMode=false;

const COLORS=['#FF5A1F','#FF2D95','#FFD400','#7CFF3B','#00C6FF','#FFFFFF'];

/* 明るい色の上では数字を黒にする */
function textOn(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)>170 ? '#000000' : '#FFFFFF';
}
function rgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(cv.clientWidth*dpr); cv.height=Math.round(cv.clientHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(img) fitS=Math.min(cv.clientWidth/img.width, cv.clientHeight/img.height);
  draw();
}
window.addEventListener('resize',resize);

function fitView(){
  if(!img) return;
  const w=cv.clientWidth, h=cv.clientHeight;
  fitS=Math.min(w/img.width,h/img.height);
  view.s=fitS;
  view.x=(w-img.width*view.s)/2;
  view.y=(h-img.height*view.s)/2;
  draw();
}
/* 写真が画面外へ飛んでいかないように位置を制限 */
function clampView(){
  if(!img) return;
  const w=cv.clientWidth, h=cv.clientHeight;
  const iw=img.width*view.s, ih=img.height*view.s;
  const mx=Math.min(70,iw*0.5), my=Math.min(70,ih*0.5);
  view.x=Math.min(w-mx, Math.max(mx-iw, view.x));
  view.y=Math.min(h-my, Math.max(my-ih, view.y));
}
function toScreen(p){return {x:p.x*view.s+view.x, y:p.y*view.s+view.y};}
function toImage(x,y){return {x:(x-view.x)/view.s, y:(y-view.y)/view.s};}

function draw(){
  ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  if(!img) return;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(img, view.x, view.y, img.width*view.s, img.height*view.s);
  const R=markR, tc=textOn(markColor);
  marks.forEach((m,i)=>{
    const p=toScreen(m);
    if(p.x<-R||p.y<-R||p.x>cv.clientWidth+R||p.y>cv.clientHeight+R) return;
    ctx.beginPath(); ctx.arc(p.x,p.y,R,0,7);
    ctx.fillStyle=rgba(markColor,.42); ctx.fill();
    ctx.lineWidth=Math.max(2,R*0.2); ctx.strokeStyle=markColor; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x,p.y,R,0,7); ctx.lineWidth=1; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.stroke();
    if(showNums&&R>=10){
      ctx.font=`700 ${Math.round(R*0.9)}px Roboto, sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=Math.max(2,R*0.22);
      ctx.strokeStyle=tc==='#000000'?'rgba(255,255,255,.7)':'rgba(0,0,0,.65)';
      ctx.strokeText(i+1,p.x,p.y+1);
      ctx.fillStyle=tc; ctx.fillText(i+1,p.x,p.y+1);
    }
  });
  // 打った点をつないで輪郭を描く（描いている途中）
  if(roiMode && roiDraft.length>0){
    ctx.beginPath();
    const p0=toScreen(roiDraft[0]); ctx.moveTo(p0.x,p0.y);
    for(let i=1;i<roiDraft.length;i++){ const p=toScreen(roiDraft[i]); ctx.lineTo(p.x,p.y); }
    ctx.lineWidth=3; ctx.strokeStyle='#00C6FF'; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
    // 打った点そのものにも印をつける（次にどこを打ったか分かるように）
    roiDraft.forEach((pt,i)=>{
      const p=toScreen(pt);
      ctx.beginPath(); ctx.arc(p.x,p.y,i===0?7:5,0,7);
      ctx.fillStyle= i===0 ? '#FFD400' : '#00C6FF';
      ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#04222B'; ctx.stroke();
    });
  }
  if(roi && roi.points && roi.points.length>2){
    // 「全体の四角」から「囲んだ形」をくり抜いて塗る＝外側だけが暗くなる（合成モードを使わない確実な方法）
    ctx.beginPath();
    ctx.rect(0,0,cv.clientWidth,cv.clientHeight);
    const q0=toScreen(roi.points[0]); ctx.moveTo(q0.x,q0.y);
    for(let i=1;i<roi.points.length;i++){ const p=toScreen(roi.points[i]); ctx.lineTo(p.x,p.y); }
    ctx.closePath();
    ctx.fillStyle='rgba(10,7,5,.55)';
    ctx.fill('evenodd');
    // 囲んだ形の輪郭
    ctx.beginPath();
    ctx.moveTo(q0.x,q0.y);
    for(let i=1;i<roi.points.length;i++){ const p=toScreen(roi.points[i]); ctx.lineTo(p.x,p.y); }
    ctx.closePath();
    ctx.setLineDash([8,6]); ctx.lineWidth=2.5; ctx.strokeStyle='#00C6FF'; ctx.stroke(); ctx.setLineDash([]);
  }
  if(false&&guide&&logR){
    const rr=logR*view.s, cx=cv.clientWidth/2, cy=cv.clientHeight/2;
    ctx.setLineDash([6,5]); ctx.lineWidth=2.5; ctx.strokeStyle='#FFD400';
    ctx.beginPath(); ctx.arc(cx,cy,rr,0,7); ctx.stroke(); ctx.setLineDash([]);
    ctx.font='700 12px Roboto, sans-serif'; ctx.textAlign='center';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.7)';
    ctx.strokeText('木口1本の大きさの目安', cx, cy-rr-10);
    ctx.fillStyle='#FFD400'; ctx.fillText('木口1本の大きさの目安', cx, cy-rr-10);
  }
}
function updateCount(){ numEl.textContent=marks.length; }

/* ---- タップ・ピンチ操作 ---- */
const pts=new Map();
let start=null, moved=false, pinch=null;

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ start={x:e.clientX,y:e.clientY}; moved=false; }
  else if(pts.size===2){
    const [a,b]=[...pts.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2};
    moved=true;
  }
});
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!img) return;
  const prev=pts.get(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>10) moved=true;
    if(moved){ view.x+=dx; view.y+=dy; clampView(); draw(); }
  }else if(pts.size===2&&pinch){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    const ns=Math.max(fitS, Math.min(fitS*40, view.s*(d/pinch.d)));
    const k=ns/view.s;
    view.x=cx-(pinch.cx-view.x)*k;
    view.y=cy-(pinch.cy-view.y)*k;
    view.s=ns;
    clampView();
    pinch={d,cx,cy};
    draw();
  }
});
function up(e){
  if(!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if(pts.size===0){
    if(!moved&&img) tap(e.clientX,e.clientY);
    pinch=null;
  }else if(pts.size===1){
    pinch=null; moved=true;
    const p=[...pts.values()][0]; start={x:p.x,y:p.y};
  }
}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);

function tap(x,y){
  const r=cv.getBoundingClientRect();
  const sx=x-r.left, sy=y-r.top;
  if(roiMode){
    roiDraft.push(toImage(sx,sy));
    updateRoiBanner();
    draw();
    return;
  }
  if(eraseMode){
    const hit=Math.max(markR+10,24);
    for(let i=marks.length-1;i>=0;i--){
      const p=toScreen(marks[i]);
      if(Math.hypot(p.x-sx,p.y-sy)<hit){ marks.splice(i,1); updateCount(); draw(); vib(30); beep('del'); return; }
    }
    return; // 印のない所をタップしても何も起きない
  }
  marks.push(toImage(sx,sy)); updateCount(); draw(); vib(12);
  beep(marks.length%10===0?'ten':'add');
}
function vib(ms){ if(navigator.vibrate) navigator.vibrate(ms); }

/* タップ音：10本ごとに高い音で区切りが分かる */
function beep(kind){
  if(!soundOn) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type= kind==='del' ? 'sawtooth' : 'square';
    const f= kind==='del' ? 300 : kind==='ten' ? 1320 : 880;
    o.frequency.setValueAtTime(f,t);
    if(kind==='ten') o.frequency.setValueAtTime(1760,t+0.05);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.4,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==='ten'?0.16:0.08));
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+(kind==='ten'?0.18:0.1));
  }catch(_){}
}

/* ---- 写真の読み込み ---- */
async function decode(file){
  if(window.createImageBitmap){
    try{ return {bmp:await createImageBitmap(file,{imageOrientation:'from-image'}), url:null}; }catch(_){}
  }
  const url=URL.createObjectURL(file);
  const el=await new Promise((res,rej)=>{
    const i=new Image();
    i.onload=()=>res(i);
    i.onerror=()=>rej(new Error('画像をデコードできません'));
    i.src=url;
  }).catch(err=>{ URL.revokeObjectURL(url); throw err; });
  return {bmp:el, url};
}

async function load(file){
  busy.classList.remove('hide');
  try{
    const {bmp,url}=await decode(file);
    const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight;
    if(!w||!h){ if(url) URL.revokeObjectURL(url); throw new Error('サイズ0の画像'); }
    if(img&&img.close) img.close();
    if(curURL) URL.revokeObjectURL(curURL);
    img=bmp; curURL=url;
    marks=[]; view={s:1,x:0,y:0}; updateCount();
    gdata=null; roi=null; roiMode=false; roiDraft=[]; guide=false;
    logR=0;
    document.getElementById('autoPanel').classList.add('hide');
    eraseMode=false;
    document.getElementById('erase').classList.remove('erasing');
    document.getElementById('eraseBanner').classList.add('hide');
    document.body.classList.remove('erasing');
    emptyBox.classList.add('hide');
    bar.classList.remove('hide');
    countBox.classList.remove('hide');
    flash('2本指で拡大・移動／消すときは「消す」をオンに', 4000);
    resize(); fitView(); placePanels();
    loadAI().then(ok=>{
      const v=document.getElementById('ver');
      v.textContent = APP_VER+(ok ? ' AI ○' : ' AI ×');
      v.style.color = ok ? '#7CFF3B' : '#FF8A5C';

  }finally{
    busy.classList.add('hide');
  }
}

/* ================= 自動カウント v2 =================
   ・空/車体は色（赤み）で除外
   ・木口の大きさは利用者が指定（写真からの自動推定は当てにならない）
   ・多スケールのLoG（丸検出）で中心を拾う
   通信もライブラリも不要。 */
let gdata=null;                 // 縮小画像のキャッシュ
let roi=null, roiMode=false, roiDraft=[];   // roi.points は指でタップして作った輪郭（画像座標）

/* 手描きの輪郭を、指定した幅・高さの塗り絵として焼き込む。
   1(内側)/0(外側)の判定に、ピクセルごとの計算ではなくCanvasの塗りつぶしを使う（速い）。 */
function rasterizePoly(points, w, h, scaleX, scaleY){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.beginPath();
  g.moveTo(points[0].x*scaleX, points[0].y*scaleY);
  for(let i=1;i<points.length;i++) g.lineTo(points[i].x*scaleX, points[i].y*scaleY);
  g.closePath(); g.fillStyle='#fff'; g.fill();
  return g.getImageData(0,0,w,h).data; // .data[i*4+3] > 0 なら内側
}
let logR=0;                     // 木口の半径（元画像の画素）
let guide=false;                // 大きさの目安の丸を表示中か

function prepGray(){
  const maxSide=900;
  const sc=Math.min(1, maxSide/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d',{willReadFrequently:true});
  g.drawImage(img,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data;
  const gray=new Float32Array(w*h), wood=new Uint8Array(w*h);
  for(let i=0,p=0;i<gray.length;i++,p+=4){
    const r=d[p],gg=d[p+1],b=d[p+2];
    gray[i]=(r*299+gg*587+b*114)/1000;
    wood[i]= (r-b)>10 ? 1:0;     // 木は赤み寄り、空は青寄り
  }
  gdata={gray,wood,w,h,sc};
}

/* ガウスぼかし（箱ぼかし3回で近似） */
function boxBlur(src,dst,w,h,r){
  const tmp=new Float32Array(w*h), inv=1/(2*r+1);
  for(let y=0;y<h;y++){
    const o=y*w; let acc=0;
    for(let x=-r;x<=r;x++) acc+=src[o+Math.min(w-1,Math.max(0,x))];
    for(let x=0;x<w;x++){
      tmp[o+x]=acc*inv;
      acc+=src[o+Math.min(w-1,x+r+1)]-src[o+Math.max(0,x-r)];
    }
  }
  for(let x=0;x<w;x++){
    let acc=0;
    for(let y=-r;y<=r;y++) acc+=tmp[Math.min(h-1,Math.max(0,y))*w+x];
    for(let y=0;y<h;y++){
      dst[y*w+x]=acc*inv;
      acc+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x];
    }
  }
}
function gaussian(src,w,h,sigma){
  const r=Math.max(1,Math.round(sigma*0.9));
  const a=new Float32Array(w*h), b=new Float32Array(w*h);
  boxBlur(src,a,w,h,r); boxBlur(a,b,w,h,r); boxBlur(b,a,w,h,r);
  return a;
}

function detect(sensV, R){
  const {gray,wood,w,h}=gdata;
  const mask=new Uint8Array(w*h);
  if(roi && roi.points && roi.points.length>2){
    const rd=rasterizePoly(roi.points, w, h, gdata.sc, gdata.sc);
    for(let i=0;i<w*h;i++) mask[i]=wood[i] && rd[i*4+3]>0 ? 1:0;
  }else{
    for(let i=0;i<w*h;i++) mask[i]=wood[i];
  }

  // 日向と日陰の明るさの差をならす（局所正規化）
  const rr=Math.max(2,Math.round(R*1.5));
  const mu=new Float32Array(w*h), sq=new Float32Array(w*h), mu2=new Float32Array(w*h);
  boxBlur(gray,mu,w,h,rr);
  for(let i=0;i<w*h;i++) sq[i]=gray[i]*gray[i];
  boxBlur(sq,mu2,w,h,rr);
  const gN=new Float32Array(w*h);
  for(let i=0;i<w*h;i++){
    const sd=Math.sqrt(Math.max(mu2[i]-mu[i]*mu[i],1));
    gN[i]=(gray[i]-mu[i])/sd*40+128;
  }

  // 多スケールLoG：木口の大小に対応
  const best=new Float32Array(w*h).fill(-1e9), bestR=new Float32Array(w*h);
  for(const f of [0.55,0.8,1.15,1.6]){
    const sg=Math.max(1,R*f/1.5);
    const B=gaussian(gN,w,h,sg), k=sg*sg;
    for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
      const i=y*w+x;
      if(!mask[i]) continue;
      const v=-(B[i-1]+B[i+1]+B[i-w]+B[i+w]-4*B[i])*k;
      if(v>best[i]){ best[i]=v; bestR[i]=R*f; }
    }
  }

  // 局所最大を候補にする
  const cand=[];
  for(let y=2;y<h-2;y++) for(let x=2;x<w-2;x++){
    const i=y*w+x, v=best[i];
    if(!mask[i]||v<=0) continue;
    let top=true;
    for(let dy=-2;dy<=2&&top;dy++) for(let dx=-2;dx<=2;dx++){
      if(best[i+dy*w+dx]>v){ top=false; break; }
    }
    if(top) cand.push([v,x,y,bestR[i]]);
  }
  if(!cand.length) return [];
  // 感度で強さのしきい値を決める
  const sorted=cand.map(c=>c[0]).sort((a,b)=>b-a);
  const cut=sorted[Math.min(sorted.length-1, Math.floor(sorted.length*(0.12+sensV*0.085)))];
  cand.sort((a,b)=>b[0]-a[0]);

  const peaks=[], cell=Math.max(4,R*0.8), grid=new Map();
  for(const [v,x,y,r] of cand){
    if(v<cut) break;
    const cx=(x/cell)|0, cy=(y/cell)|0; let ok=true;
    for(let a=-2;a<=2&&ok;a++) for(let b=-2;b<=2&&ok;b++){
      const l=grid.get((cx+a)+','+(cy+b)); if(!l) continue;
      for(const p of l){
        const dm=Math.max(p.r,r)*1.25;
        if((p.x-x)**2+(p.y-y)**2<dm*dm){ ok=false; break; }
      }
    }
    if(!ok) continue;
    const p={x,y,r}; peaks.push(p);
    const k2=cx+','+cy; if(!grid.has(k2)) grid.set(k2,[]); grid.get(k2).push(p);
    if(peaks.length>2500) break;
  }
  return peaks;
}


/* ================= 学習済みモデル(AI)で数える =================
   モデルが同じ場所に置いてあれば、そちらを使う。
   無ければ従来の画像処理に自動で切り替わる。 */
const MODEL_FILE='./genboku_yolox_int8.onnx';  // 差し替える時はここだけ変える
const AI_SIZE=960;                 // 学習時と同じ大きさ

/* AIライブラリの候補。
   新しい版は「モジュール形式」なので import で読む。
   古い版は普通のスクリプトで読める。順に試す。 */
const AI_LIBS=[
  {way:'mjs', base:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/', file:'ort.min.mjs'},
  {way:'mjs', base:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/', file:'ort.min.mjs'},
  {way:'tag', base:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/', file:'ort.min.js'},
  {way:'tag', base:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/', file:'ort.min.js'},
  {way:'mjs', base:'https://unpkg.com/onnxruntime-web@1.20.1/dist/',            file:'ort.min.mjs'},
];
let ort=null, session=null, aiReady=false, aiTried=false, aiError='';

function loadTag(url){
  return new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=url;
    el.onload=()=>res();
    el.onerror=()=>rej(new Error('取得不可'));
    document.head.appendChild(el);
    setTimeout(()=>rej(new Error('時間切れ')),25000);
  });
}

async function loadAI(){
  if(aiTried) return aiReady;
  aiTried=true;
  aiError='';
  const logs=[];
  let base=null;

  for(const c of AI_LIBS){
    const tag=c.way+'@'+(c.base.match(/@([\d.]+)/)||['',''])[1];
    try{
      if(c.way==='mjs'){
        const m=await import(c.base+c.file);
        if(m && m.InferenceSession){ ort=m; base=c.base; break; }
        if(window.ort){ ort=window.ort; base=c.base; break; }
        logs.push(tag+':中身なし');
      }else{
        await loadTag(c.base+c.file);
        if(window.ort){ ort=window.ort; base=c.base; break; }
        logs.push(tag+':ortなし');
      }
    }catch(e){
      logs.push(tag+':'+String(e.message||e).slice(0,40));
    }
  }

  if(!ort){
    aiError='ライブラリ不可 ['+logs.slice(0,5).join(' / ')+']';
    return false;
  }

  try{
    ort.env.wasm.wasmPaths=base;
    ort.env.wasm.numThreads=1;
    const res=await fetch(MODEL_FILE);
    if(!res.ok) throw new Error('モデルHTTP '+res.status);
    const buf=new Uint8Array(await res.arrayBuffer());
    if(buf.length<1000) throw new Error('モデルが小さい('+buf.length+')');
    session=await ort.InferenceSession.create(buf,{executionProviders:['wasm']});
    aiReady=true; aiError='';
  }catch(e){
    aiError='モデル: '+String(e.message||e).slice(0,120);
    aiReady=false;
  }
  return aiReady;
}

/* 写真を960x960の正方形に収める（余白は灰色で埋める）。

   YOLOXは【左上に詰めて・0〜255のまま・青緑赤(BGR)の順】で学習している。
   ここを間違えても画面にエラーは出ず、本数だけが静かにズレる。
   実測では色の順を間違えるだけで平均のズレが0.56本→0.71本に悪化した。 */
function letterbox(){
  const c=document.createElement('canvas'); c.width=AI_SIZE; c.height=AI_SIZE;
  const g=c.getContext('2d',{willReadFrequently:true});
  g.fillStyle='#727272'; g.fillRect(0,0,AI_SIZE,AI_SIZE);
  const sx=roi?roi.x0:0, sy=roi?roi.y0:0;
  const sw=roi?(roi.x1-roi.x0):img.width, sh=roi?(roi.y1-roi.y0):img.height;
  const r=Math.min(AI_SIZE/sw, AI_SIZE/sh);
  const dw=Math.round(sw*r), dh=Math.round(sh*r);
  const dx=0, dy=0;                       // 中央ではなく左上に詰める
  g.drawImage(img, sx,sy,sw,sh, dx,dy,dw,dh);
  // 手描きの範囲がある時は、外側をパディングと同じ灰色で塗りつぶす
  if(roi && roi.points && roi.points.length>2){
    g.save();
    g.beginPath();
    g.rect(0,0,AI_SIZE,AI_SIZE);
    g.moveTo(dx+(roi.points[0].x-sx)*r, dy+(roi.points[0].y-sy)*r);
    for(let i=roi.points.length-1;i>=0;i--)
      g.lineTo(dx+(roi.points[i].x-sx)*r, dy+(roi.points[i].y-sy)*r);
    g.closePath();
    g.fillStyle='#727272';
    g.fill('evenodd');
    g.restore();
  }
  const d=g.getImageData(0,0,AI_SIZE,AI_SIZE).data;
  const n=AI_SIZE*AI_SIZE, f=new Float32Array(3*n);
  for(let i=0,p=0;i<n;i++,p+=4){
    f[i]=d[p+2]; f[n+i]=d[p+1]; f[2*n+i]=d[p];   // 青・緑・赤の順。255で割らない
  }
  return {data:f, r, dx, dy, sx, sy};
}

/* モデルの出力から、重なりを整理して木口の中心を取り出す。

   出力は [1, 18900, 6] の形。18900個の候補それぞれに6つの数字が並ぶ:
     [中心x, 中心y, 幅, 高さ, 物体らしさ, 木口らしさ]
   厳しさと比べるのは「物体らしさ × 木口らしさ」。
   箱の位置はすでに960の中の座標になっている（計算し直す必要はない）。 */
function decodeAI(out, m, conf){
  const d=out.data, N=out.dims[1];
  const cand=[];
  for(let i=0;i<N;i++){
    const o=i*6;
    const s=d[o+4]*d[o+5];
    if(s<conf) continue;
    const cx=d[o], cy=d[o+1], w=d[o+2], h=d[o+3];
    cand.push({s,cx,cy,x1:cx-w/2,y1:cy-h/2,x2:cx+w/2,y2:cy+h/2});
  }
  cand.sort((a,b)=>b.s-a.s);
  const keep=[];
  for(const b of cand){
    let ok=true;
    for(const k of keep){
      const iw=Math.min(b.x2,k.x2)-Math.max(b.x1,k.x1);
      const ih=Math.min(b.y2,k.y2)-Math.max(b.y1,k.y1);
      if(iw<=0||ih<=0) continue;
      const inter=iw*ih;
      const uni=(b.x2-b.x1)*(b.y2-b.y1)+(k.x2-k.x1)*(k.y2-k.y1)-inter;
      if(inter/uni>0.45){ ok=false; break; }
    }
    if(ok) keep.push(b);
    if(keep.length>3000) break;
  }
  // 元の写真の座標に戻す
  return keep.map(b=>({ x: m.sx+(b.cx-m.dx)/m.r, y: m.sy+(b.cy-m.dy)/m.r }));
}

async function runAI(conf){
  const m=letterbox();
  const t=new ort.Tensor('float32', m.data, [1,3,AI_SIZE,AI_SIZE]);
  const feeds={}; feeds[session.inputNames[0]]=t;
  const res=await session.run(feeds);
  return decodeAI(res[session.outputNames[0]], m, conf);
}

/* 指定された本数に検出数が近づく木口の大きさを、二分探索で自動的に見つける（従来方式） */
function searchDetect(n){
  const w=gdata.w;
  let lo=w*0.008, hi=w*0.12, best=null;
  for(let i=0;i<7;i++){
    const R=(lo+hi)/2;
    const pk=detect(SENS,R);
    if(best===null || Math.abs(pk.length-n)<Math.abs(best.n-n)) best={pk,n:pk.length,R};
    if(pk.length>n) lo=R; else hi=R;
    if(pk.length===n) break;
  }
  return best;
}

/* 画面下に少しの間だけ出る知らせ。写真の邪魔をしないよう自動で消える */

  hint.innerHTML='<span>'+msg+'</span>';
  hint.classList.remove('hide');
  hint.style.opacity=1;
  placePanels();                       // 下のバーの高さに合わせて位置を決める

}

async function runAuto(){
  if(!img) return;
  if(marks.length && !confirm('今の印を消して数え直しますか？')) return;
  busy.textContent = aiReady ? 'AIが数えています…' : '自動で数えています…';
  busy.classList.remove('hide');
  await new Promise(r=>setTimeout(r,60));
  const t0=performance.now();
  try{
    let pts;
    if(aiReady){
      pts = await runAI(confValue);
    }else{
      if(!gdata) prepGray();
      const res=searchDetect(+guess.value);
      logR=res.R/gdata.sc;
      pts = res.pk.map(p=>({x:p.x/gdata.sc, y:p.y/gdata.sc}));
    }
    // 上の段から左→右の順に番号がつくよう並べ替え
    const rowH=img.height*0.05;
    pts.sort((a,b)=> Math.abs(a.y-b.y)>rowH ? a.y-b.y : a.x-b.x);
    marks=pts;
    guide=false; updateCount();
    roi=null; document.getElementById('roiAll').classList.add('hide');
    draw();
    // 数え終わったら写真を確かめたいので、パネルは畳んで写真を見せる
    closeAuto();
    flash(`<b style="color:var(--paint)">${marks.length}本</b> 検出（${((performance.now()-t0)/1000).toFixed(1)}秒）`+
      `　抜けはタップで追加、余分は「消す」で削除`);
    beep('ten');
  }catch(err){
    console.error(err);
    alert('自動カウントに失敗しました。手動で数えてください。');
  }finally{
    busy.classList.add('hide'); busy.textContent='写真を読み込み中…';
  }
}

/* ================= 範囲を指でタップして囲む =================
   1点ずつタップして角を置いていく方式。指を動かしても点を打つまでは

function updateRoiBanner(){
  const n=roiDraft.length;
  roiCountEl.textContent = n===0 ? 'まだ0点' : `${n}点　（3点以上で決定できます）`;
  roiMsgEl.textContent = n===0
    ? '写真の上を指でタップして、範囲の角を順番に囲んでください'
    : '続けてタップして角を足してください。指を動かせば拡大・移動もできます';

  roiFinishBtn.disabled = n<3;

  autoPanel.classList.add('hide');
  roiBanner.classList.remove('hide');

  roiMode=false; roiDraft=[];
  roiBanner.classList.add('hide');
  autoPanel.classList.remove('hide'); placePanels();

  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const p of roiDraft){ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }

  autoMsg.textContent='範囲を指定しました。「自動」を押すと数えられます。';
  endRoi();

/* ================= 学習データの書き出し =================
   写真（長辺1600pxのJPEG）とタップ位置を1つのファイルにまとめる。
   後でAIの学習データに使えるよう、座標は0〜1の比率でも持たせる。 */
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function downloadBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
document.getElementById('saveData').onclick=()=>{
  if(!img) return;
  if(!marks.length){ alert('印が1つもありません。数えてから保存してください。'); return; }
  const memo=prompt('メモ（現場名・荷主・樹種など／空欄でも可）','')||'';
  const maxSide=1600;
  const sc=Math.min(1,maxSide/Math.max(img.width,img.height));
  const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  const jpeg=c.toDataURL('image/jpeg',0.88).split(',')[1];
  const rec={
    format:'genboku-count/1',
    created:new Date().toISOString(),
    memo:memo,
    count:marks.length,
    image:{width:w,height:h,source_width:img.width,source_height:img.height},
    points:marks.map(m=>({
      x:+(m.x/img.width).toFixed(5), y:+(m.y/img.height).toFixed(5),   // 0〜1の比率
      px:Math.round(m.x*sc), py:Math.round(m.y*sc)                     // 保存画像での画素
    })),
    settings:{
      log_radius_ratio:+(logR/img.width).toFixed(4),
      mode: aiReady ? "ai" : "cv",
      conf: aiReady ? confValue : null,
      sens:SENS,
      guess:+guess.value,
      roi: roi ? {x0:+(roi.x0/img.width).toFixed(4), y0:+(roi.y0/img.height).toFixed(4),
                  x1:+(roi.x1/img.width).toFixed(4), y1:+(roi.y1/img.height).toFixed(4)} : null
    },
    jpeg_base64:jpeg
  };
  const blob=new Blob([JSON.stringify(rec)],{type:'application/json'});
  downloadBlob(blob, `genboku_${stamp()}_${marks.length}hon.json`);
  closeSave();
  const mb=(blob.size/1048576).toFixed(1);
  setTimeout(()=>alert(`学習データを保存しました（約${mb}MB）。\n\nダウンロードフォルダに貯まります。定期的にパソコンやクラウドへ移してください。`),300);
};

/* ================= 電卓 =================
   荷台を何回かに分けて数えた時に、その場で足せるようにするためのもの。
   開くと今の本数が入った状態で始まる。 */
const calcPanel=document.getElementById('calcPanel');
const calcBtn=document.getElementById('calcBtn');
const calcDisp=document.getElementById('calcDisp');
const calcExpr=document.getElementById('calcExpr');

let cAcc=null;      // ここまでの計算結果
let cOp=null;       // 待っている記号（＋−×÷）
let cCur='0';       // いま打ち込んでいる数
let cFresh=true;    // 次に数字を押したら打ち直すか

const OP_SIGN={'+':'＋','-':'−','*':'×','/':'÷'};

function calcShow(){
  calcDisp.textContent=cCur;
  calcExpr.innerHTML = cOp ? `${trim(cAcc)} ${OP_SIGN[cOp]}` : '&nbsp;';
}
/* 小数の誤差で 0.30000000000000004 のような表示にならないようにする */
function trim(n){
  if(!isFinite(n)) return 'エラー';
  return String(Math.round(n*1e9)/1e9);
}
function apply(a,op,b){
  switch(op){
    case '+': return a+b;
    case '-': return a-b;
    case '*': return a*b;
    case '/': return b===0 ? NaN : a/b;
  }
  return b;
}
function calcKey(k){
  if(k==='C'){ cAcc=null; cOp=null; cCur='0'; cFresh=true; }
  else if(k==='back'){
    if(cFresh){ cCur='0'; }
    else { cCur=cCur.slice(0,-1); if(cCur===''||cCur==='-') cCur='0'; }
  }
  else if(k==='.'){
    if(cFresh){ cCur='0.'; cFresh=false; }
    else if(!cCur.includes('.')) cCur+='.';
  }
  else if('0123456789'.includes(k)){
    if(cFresh){ cCur=k; cFresh=false; }
    else cCur = cCur==='0' ? k : cCur+k;
  }
  else if(k==='='){
    if(cOp!==null){
      const expr=`${trim(cAcc)} ${OP_SIGN[cOp]} ${cCur}`;
      cCur=trim(apply(cAcc,cOp,+cCur)); cAcc=null; cOp=null;
      pushHist(expr, cCur);
    }
    cFresh=true;
  }
  else{  // ＋−×÷
    if(cOp!==null && !cFresh) cCur=trim(apply(cAcc,cOp,+cCur));
    cAcc=+cCur; cOp=k; cFresh=true;
  }
  calcShow();
}
document.getElementById('calcKeys').addEventListener('click', e=>{
  const b=e.target.closest('.ck');
  if(b) { calcKey(b.dataset.k); vib(8); }
});
/* ---- 履歴（30回分） ----
   計算した内容は端末に残るので、アプリを閉じても消えない。
   行を押すとその答えから計算を続けられる。 */
const HIST_MAX=30, HIST_KEY='genboku-calc-hist';
const histBtn=document.getElementById('calcHistBtn');
const histBox=document.getElementById('calcHist');
const keysBox=document.getElementById('calcKeys');
let calcHist=[];
try{ calcHist=JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch(e){ calcHist=[]; }

function saveHist(){
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(calcHist)); }catch(e){}
}
function pushHist(expr, result){
  calcHist.unshift({e:expr, r:result});
  if(calcHist.length>HIST_MAX) calcHist.length=HIST_MAX;
  saveHist();
  if(!histBox.classList.contains('hide')) drawHist();
}
function drawHist(){
  histBox.innerHTML='';
  if(!calcHist.length){
    histBox.innerHTML='<div class="empty">まだ計算していません</div>';
    return;
  }
  calcHist.forEach(h=>{
    const b=document.createElement('button');
    b.className='hrow';
    b.innerHTML=`<span class="he">${h.e} ＝</span><span class="hr">${h.r}</span>`;
    b.onclick=()=>{ cCur=h.r; cAcc=null; cOp=null; cFresh=false; calcShow(); showKeys(); };
    histBox.appendChild(b);
  });
  const c=document.createElement('button');
  c.className='clear'; c.textContent='履歴を全部消す';
  c.onclick=()=>{
    if(!confirm('計算の履歴を全部消しますか？')) return;
    calcHist=[]; saveHist(); drawHist();
  };
  histBox.appendChild(c);
}
function showKeys(){
  histBox.classList.add('hide'); keysBox.classList.remove('hide');
  histBtn.classList.remove('on');
}
histBtn.onclick=()=>{
  if(histBox.classList.contains('hide')){
    drawHist();
    histBox.classList.remove('hide'); keysBox.classList.add('hide');
    histBtn.classList.add('on');
  }else showKeys();
};

function closeCalc(){ calcPanel.classList.add('hide'); calcBtn.classList.remove('on'); showKeys(); }
calcBtn.onclick=()=>{
  if(!calcPanel.classList.contains('hide')){ closeCalc(); return; }
  closePanels();
  // 打ち込んだ内容は写真を変えても残す（開き直しても消さない）
  calcShow();
  calcPanel.classList.remove('hide');
  calcBtn.classList.add('on');
  placePanels();
};

/* ================= パネル上部の摘み =================
   タップするか、下へ引き下げると閉じる。
   どのパネルも閉じ方は同じにしてある。 */
function bindGrab(panelEl, closeFn){
  const g=panelEl.querySelector('.grab');
  if(!g) return;
  let id=null, y0=0, moved=0;

  g.addEventListener('pointerdown', e=>{
    id=e.pointerId; y0=e.clientY; moved=0;
    g.classList.add('hot');
    g.setPointerCapture(id);
    e.preventDefault();
  });

  g.addEventListener('pointermove', e=>{
    if(e.pointerId!==id) return;
    moved=e.clientY-y0;
    // 下へ引いた分だけパネルも下がって、閉じる手応えが出る
    panelEl.style.transform = moved>0 ? `translateY(${moved}px)` : '';
    if(moved>70) g.classList.remove('hot');
  });

  function finish(e){
    if(e.pointerId!==id) return;
    id=null;
    g.classList.remove('hot');
    panelEl.style.transform='';
    // 指をほとんど動かさなければタップ、下へ70px以上引けば引き下げ
    if(Math.abs(moved)<8 || moved>70) closeFn();
  }
  g.addEventListener('pointerup', finish);
  g.addEventListener('pointercancel', finish);
}

bindGrab(autoPanel, closeAuto);
bindGrab(savePanel, closeSave);
bindGrab(panel, closeLook);
bindGrab(calcPanel, closeCalc);

resize();
</script>
