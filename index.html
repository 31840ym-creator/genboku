<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1E1610">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<title>原木カウンター</title>
<style>
  :root{
    --bark:#1E1610;
    --bark-2:#2C2117;
    --sawn:#E9DCC4;
    --sawn-dim:#A2937B;
    --paint:#FF5A1F;
    --paint-ink:#1E1610;
    --calc-op:#FFD400;      /* 電卓の＋−×÷と＝ */
    --line:#463527;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* 指が少し動いても押したことにする。画面を動かす仕草と取り合って
     押しても反応しないことがあった(2026-09-20) */
  button,a{touch-action:manipulation;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bark);color:var(--sawn);
    font-family:"Roboto","Noto Sans JP",system-ui,sans-serif;}
  /* 画面ぜんぶを包む入れ物。横向きにする時はこれごと90度回す。
     transform が掛かると、中の position:fixed はこの入れ物を基準に並ぶので、
     写真・ボタン・パネル・帯が**全部いっしょに回る**。
     大きさと回す量は JS が実寸で入れる(端末のURLバーで 100vh がずれるため)。 */
  #app{position:fixed;top:0;left:0;width:100%;height:100%;transform-origin:0 0;}

  /* ---- 背の低い画面(横向き)では、パネルを「消すモード」の帯くらい薄くする ----
     横向きだと高さが375px程度しかないのに、案内のパネルが170px以上あって
     写真がほとんど見えなかった(2026-09-17)。
     文字を1行に詰め、ボタンを横に並べ、余白を削る。 */
  /* ---- 横向きの下まわりの配置(2026-09-19) ----

     横向きは**横に広い**ので、下のバーを画面いっぱいに伸ばす意味がない。
     ボタンは縦向きと同じ大きさのまま**右へ寄せ**、
     空いた**左下**に案内のパネル(数える・範囲を囲う など)を置く。
     こうすると両方が同じ帯に収まり、写真の見える高さが1段分ぶん増える。 */
  body.short #bar{justify-content:flex-end;gap:6px;
    background:linear-gradient(to top,rgba(30,22,16,.55),rgba(30,22,16,0));}
  body.short #bar button{flex:0 0 auto;width:54px;padding:7px 2px 6px;font-size:10px;
    background:rgba(38,30,22,.94);backdrop-filter:blur(6px);}
  body.short #bar button i{font-size:16px;}
  /* パネルは左下。幅は「ボタンの手前まで」に収める(--panelmax はJSが実測して入れる) */
  body.short #autoPanel, body.short #savePanel, body.short #morePanel,
  body.short #panel, body.short #setPanel, body.short #statusPanel,
  body.short #roiBanner, body.short #eraseBanner, body.short #roiGo{
    left:8px;right:auto;width:auto;max-width:var(--panelmax,60%);}
  /* 帯も浮いた箱になるので角を丸める */
  body.short #roiBanner, body.short #eraseBanner{border-radius:13px;}
  /* 数え終わりなどの知らせも、他のパネルと同じ左下に置く。
     真ん中に出すと写真に重なり、縦に3行で分厚くなっていた(2026-09-20) */
  body.short #hint{left:8px;right:auto;width:auto;max-width:var(--panelmax,60%);
    text-align:left;padding:0;}
  body.short #hint span{max-width:100%;}
  body.short #hint span.multi{display:flex;align-items:center;gap:10px;padding:7px 14px;}
  body.short #hint i{margin:0;padding:0 0 0 10px;border-top:none;
    border-left:1px solid var(--line);}
  /* 消すモードは「いま触ると消える」という大事な合図なので、
     横向きでも小さくしない。はっきり大きく出す(2026-09-20) */
  body.short #eraseBanner{padding:13px 20px;font-size:18px;letter-spacing:.06em;
    white-space:nowrap;border-radius:15px;box-shadow:0 3px 14px rgba(0,0,0,.45);}

  /* ---- 横向き(背の低い画面)のパネル ----
     高さが375px程度しかないので、パネルは**下のバーと同じくらいの薄さ**に収める。
     文字は小さく1行、ボタンは横並び、余白は最小。つまみは重ねて高さを食わない。 */
  body.short #autoPanel, body.short #savePanel, body.short #morePanel,
  body.short #panel, body.short #setPanel, body.short #statusPanel{
    padding:5px 12px 7px;border-radius:13px;overflow-x:hidden;}
  /* 薄い帯のパネルはつまみを出さない。中身に重なって読めなくなるため。
     同じボタンをもう一度押せば閉じられる(2026-09-19) */
  body.short #autoPanel .grab, body.short #savePanel .grab, body.short #morePanel .grab,
  body.short #statusPanel .grab, body.short #calcPanel .grab{display:none;}
  /* 見た目と設定は縦向きと同じ並びで背が高いので、つまみを出す。
     余白が狭いぶん、はみ出し量を padding に合わせる(2026-09-21) */
  body.short #panel .grab, body.short #setPanel .grab{margin:-5px -12px 2px;}
  body.short .row+.row{margin-top:6px;}
  body.short .act{padding:7px 4px;font-size:12px;}
  body.short .sub{padding:7px 4px;font-size:12px;}

  /* 自動：横向きは**案内文を出さない**。ボタン2つだけの細い箱にする。
     文字を入れると幅を取り合って折り返し、パネルが分厚くなっていた(2026-09-19) */
  body.short #autoPanel{display:flex;align-items:center;gap:8px;width:auto;}
  body.short #autoMsg{display:none;}
  /* .row の入れ子をなくし、ボタンをパネル直下の並びにする。
     入れ子のままだと行ごとに高さが決まり、数pxずれる(2026-09-19) */
  body.short #autoPanel .row{display:contents;}
  /* 「数える」と「範囲を囲う」は同じ大きさ。
     枠のある・なしで高さがずれないよう box-sizing と height を明示する */
  body.short #autoPanel #redo,
  body.short #autoPanel #roiBtn,
  body.short #autoPanel #roiAll{
    width:132px;height:40px;min-height:0;padding:0;margin:0;
    font-size:15px;font-weight:700;line-height:1;border-radius:10px;
    border:1px solid transparent;box-sizing:border-box;flex:none;
    display:flex;align-items:center;justify-content:center;}
  body.short #autoPanel #roiBtn, body.short #autoPanel #roiAll{
    border-color:var(--line);border-style:dashed;}
  body.short #guessRow{flex:1 1 auto;min-width:160px;}

  /* 保存：説明と確認の文言を1行に並べ、ボタンは横並び */
  body.short #saveMsg{font-size:11px;margin:0;line-height:1.3;}
  body.short #saveCaution{font-size:11px;margin:0;line-height:1.3;}
  body.short #saveHead{display:flex;align-items:center;gap:12px;margin-bottom:5px;}
  body.short #saveBtns{display:flex;gap:8px;}
  body.short #saveBtns .row{margin:0;flex:1;}

  /* その他：横向きはボタン4つを1列に、幅をきっちり揃える。
     .row の入れ子のままだと行ごとに幅が決まり、
     絵文字の分だけ「見た目」と「戻す」で太さが変わっていた(2026-09-20)。
     並びではなく格子にしているのは、1fr の列は全部同じ幅になり、
     しかも一番長い文字に合わせて広がってくれるため(折り返さない) */
  body.short #morePanel{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;}
  body.short #morePanel .row{display:contents;}
  body.short #morePanel .act{white-space:nowrap;}
  /* 設定も見た目と同じ大きさに揃える。押す所は40px、文字は12.5px。
     「設定」の見出しは、押したボタンの名前と同じなので横向きでは出さない */
  /* 設定も縦向きと同じ並び(見出し → 規約3つ → 保存庫を作り直す)。
     押す所の高さだけ 40px を下限にしておく */
  body.short #setPanel .setHead{margin-bottom:4px;font-size:12px;}
  body.short .setLink{padding:0 2px;min-height:40px;font-size:12.5px;}
  body.short #setPanel #setReset{margin-top:8px;min-height:40px;font-size:12.5px;}
  body.short .setRow{padding:5px 0;font-size:12px;}

  /* 範囲を囲う時の帯。1行にまとめる */
  body.short #roiBanner{padding:5px 10px 6px;display:flex;align-items:center;gap:8px;width:auto;}
  /* 横向きは案内文を出さない。点数(「2点」など)だけで用は足りる。
     文字を入れるとボタンと幅を取り合って切れたり折り返したりした(2026-09-19) */
  body.short #roiMsg{display:none;}
  body.short #roiCount{margin:0;flex:0 0 auto;font-size:13px;font-weight:700;min-width:3.5em;}
  body.short #roiBanner .row{display:contents;}
  body.short #roiBanner .act{width:auto;min-width:76px;height:36px;padding:0 10px;
    font-size:12px;line-height:1;box-sizing:border-box;flex:none;
    display:flex;align-items:center;justify-content:center;}
  body.short #roiBanner .act.ghost{flex:0 0 auto;}

  /* 見た目パネル。横向きも**縦向きと同じ並び**(上から 色/大きさ/合わせ方/番号/音)。
     一時は2列に分けていたが、どこに何があるかが縦横で変わって覚え直しになる。
     並びはそろえて、余白だけ詰めることにした(2026-09-21) */
  body.short #panel .row{gap:10px;}
  body.short #panel .row+.row{margin-top:8px;}
  body.short .lab{width:52px;font-size:12px;}   /* 「合わせ方」が2行に折れない幅 */
  body.short .sw{width:30px;height:30px;}
  body.short #swatches{gap:8px;}
  body.short #panel input[type=range]{height:34px;}
  body.short #preview{width:34px;}
  /* 指で押す所は小さくしない。40px は取りこぼしが出にくい大きさ。
     色の丸もボタンなので、まるいまま残るよう外しておく */
  body.short #panel button:not(.sw){min-height:40px;padding:0 14px;font-size:12.5px;}

  /* ---- 横向きの電卓 ----

     縦向きと同じ「上から下へ」の並びのままだと、高さが足りず
     キーが横に長く潰れる(幅100px × 高さ32px のような形になっていた)。

     横向きは**横に広い**ので、並びを変える:
       左 … 履歴ボタン・式・答え・履歴
       右 … キー(4列5段)を縦いっぱいに
     こうするとキーが正方形に近くなり、押しやすくなる。
     電卓そのものを画面いっぱいに広げはしない(最大640px・中央)。 */
  body.short #calcPanel{
    left:8px;right:8px;margin:0 auto;
    display:grid;
    grid-template-columns:minmax(0,1fr) 204px;   /* 長い式で押し広げられないように */
    grid-template-rows:auto auto auto 1fr;
    column-gap:14px;
    max-width:640px;
    padding:6px 12px 10px;
  }
  body.short #calcPanel .grab{grid-column:1 / -1; grid-row:1; margin-bottom:2px;}
  body.short #calcTop {grid-column:1; grid-row:2; align-self:start; min-width:0;}
  body.short #calcDisp{grid-column:1; grid-row:3; min-width:0;}
  body.short #calcHist{grid-column:1; grid-row:4; min-width:0;}
  body.short #calcKeys{grid-column:2; grid-row:2 / 5; align-self:stretch;}
  body.short #calcHistBtn{padding:6px 12px;font-size:12px;}
  body.short #calcExpr{font-size:22px;min-height:28px;}
  body.short #calcDisp{font-size:16px;min-height:22px;margin:4px 0 0;}
  body.short #calcDisp.answer{font-size:34px;}
  body.short #calcKeys{gap:6px;}
  body.short .ck{padding:4px 2px;font-size:19px;border-radius:10px;}
  body.short .ck.fn{font-size:16px;}
  body.short #calcHist{max-height:none;}
  body.short #calcHist .hrow{padding:7px 10px;}
  body.short #calcHist .hrow .hr{font-size:16px;}
  body.short #calcHist .hrow .he{font-size:12px;}

  /* 横向きの保存パネル。2つの保存ボタンを**横に並べて**薄くする。
     確認の文言は消さない(記録に残す瞬間なので) */
  body.short #saveBtns{display:flex;gap:8px;}
  body.short #saveBtns .row{margin:0;flex:1;}
  #stage{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  #emptyBtns{display:flex;flex-direction:column;gap:10px;align-items:center;}
  .big.ghost{background:transparent;color:var(--paint);border:2px solid var(--paint);}
  #count{
    position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;
    max-width:calc(100% - var(--topright,200px) - 28px);   /* 右上のボタンにぶつからない幅まで */
    background:rgba(30,22,16,.82);border:1px solid var(--line);border-radius:14px;
    padding:5px 12px 7px;display:grid;grid-template-columns:auto auto;
    align-items:baseline;column-gap:6px;backdrop-filter:blur(6px);
  }
  #count b{font-size:32px;line-height:1;font-weight:800;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;color:var(--paint);transition:color .15s;}
  #count span{font-size:13px;color:var(--sawn-dim);letter-spacing:.08em;}
  /* AIが出した本数と、自分で直した数の内訳。荷渡しの時に根拠が分かるように */
  /* 内訳は2段目。横に並べると右上のボタンにぶつかる */
  #countBreak{grid-column:1 / -1;font-size:11px;letter-spacing:0;color:#9FD7A0;
    margin-top:2px;white-space:nowrap;}
  /* 右上：電卓ボタンと版の表示を並べる */
  /* 最初の画面(#empty)が全画面に出るので、その上に重ねて押せるようにする */
  #topRight{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;
    display:flex;align-items:center;gap:7px;z-index:5;}
  /* 向き・カメラ・電卓は同じ大きさに揃える(46x46)。ばらつくと目障りなので固定する */
  #rotate,#calcBtn,#camBtn{width:46px;height:46px;padding:0;flex:none;
    background:rgba(30,22,16,.86);border:1px solid var(--line);
    color:var(--sawn);border-radius:12px;line-height:0;backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;}
  /* 向きの切り替え。押すと「横」⇄「縦」が入れ替わる */
  #rotate{position:relative;}
  #rotate svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);
    opacity:.85;pointer-events:none;}
  #rotate b{position:relative;font-size:15px;font-weight:800;line-height:1;}
  #rotate:active{background:#3A2C1F;}
  #rotate.on{border-color:var(--paint);color:var(--paint);}
  #calcBtn svg,#camBtn svg{width:26px;height:26px;display:block;}
  #calcBtn:active,#camBtn:active{background:#3A2C1F;}
  #calcBtn.on{border-color:var(--paint);color:var(--paint);background:#3A2C1F;}
  #camBtn{color:var(--paint);}
  #backPortrait{background:var(--paint);color:var(--paint-ink);border:none;border-radius:12px;
    padding:0 12px;height:44px;font-size:14px;font-weight:700;}
  /* 上に帯（「消す」「範囲を囲む」）が出ている間は、その分だけ下げる。
     帯の高さは中身で変わるので、--topbar をJS側から入れる。
     以前は本数バッジだけ固定値で下げていて、右上のボタンが帯に被っていた。 */

  #ver{font-size:11px;color:var(--sawn-dim);background:rgba(30,22,16,.8);
    border:1px solid var(--line);border-radius:8px;padding:6px 8px;letter-spacing:.02em;
    backdrop-filter:blur(6px);white-space:nowrap;font-family:inherit;flex:none;}
  #ver.on{border-color:var(--paint);}

  /* 設定。版バッジを押すと開く */
  #statusPanel{position:fixed;left:8px;right:8px;bottom:150px;
    background:rgba(38,30,22,.97);border:1px solid var(--line);border-radius:16px;
    padding:10px 16px 12px;backdrop-filter:blur(8px);overflow-y:auto;}
  #setPanel{position:fixed;left:8px;right:8px;bottom:150px;
    background:rgba(38,30,22,.97);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px 16px;backdrop-filter:blur(8px);overflow-y:auto;overflow-x:hidden;}
  .setHead{font-size:13px;font-weight:700;color:var(--sawn);margin-bottom:10px;letter-spacing:.06em;}
  .setRow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--sawn-dim);}
  .setRow b{color:var(--sawn);font-weight:600;text-align:right;
    font-variant-numeric:tabular-nums;}
  .setLink{display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-top:1px solid var(--line);font-size:13px;
    color:var(--sawn);text-decoration:none;}
  .setLink::after{content:'›';color:var(--sawn-dim);font-size:17px;}
  .setLink.soon{color:var(--sawn-dim);pointer-events:none;}
  .setLink.soon::after{content:'準備中';font-size:11px;}
  #setReset{margin-top:14px;width:100%;}

  #empty{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;}
  #empty h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em;}
  #empty p{margin:0;font-size:14px;line-height:1.8;color:var(--sawn-dim);}
  .big{background:var(--paint);color:var(--paint-ink);border:none;border-radius:999px;
    font-size:17px;font-weight:700;padding:16px 30px;}

  /* 重なりの順番。横向きではパネルが下のバーと同じ帯に並ぶため、
     バーが手前にあるとパネルの下の方を押しても**バーに吸われて反応しない**。
     「木口に合わせる」が押せなかったのはこれ(2026-09-20)。
       3 バー < 4 パネル類 < 5 右上のボタン < 9 読み込み中の幕 */
  #bar{z-index:3;}
  #panel,#autoPanel,#savePanel,#morePanel,#setPanel,#statusPanel,
  #roiGo,#roiBanner,#eraseBanner,#calcPanel,#hint{z-index:4;}
  #busy{z-index:9;}

  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(30,22,16,.96),rgba(30,22,16,.6));}
  /* 6個を必ず1段に収める。2段になると写真の見える高さが半分近く減る */
  #bar button{flex:1 1 0;min-width:48px;background:var(--bark-2);color:var(--sawn);border:1px solid var(--line);
    border-radius:12px;padding:9px 2px 8px;font-size:11px;line-height:1.3;font-weight:600;}
  #bar button:active{background:#3A2C1F;}
  #bar button i{display:block;font-size:18px;font-style:normal;margin-bottom:1px;}
  #bar button i svg{width:20px;height:20px;display:block;margin:0 auto;}

  #morePanel{position:fixed;left:8px;right:8px;bottom:150px;
    background:rgba(38,30,22,.97);border:1px solid var(--line);border-radius:16px;
    padding:8px 16px 16px;backdrop-filter:blur(8px);overflow-y:auto;overflow-x:hidden;}
  /* 記号は絵文字と描いた図形が混ざっている。そのままだと行の高さが
     数pxずれて「見た目」と「戻す」で背が変わるので、枠を18pxに揃える */
  #morePanel .act{display:flex;align-items:center;justify-content:center;gap:6px;}
  #morePanel .act i{font-style:normal;display:inline-flex;align-items:center;
    justify-content:center;height:18px;line-height:18px;}
  #morePanel .act i svg{width:17px;height:17px;display:block;}
  #savePanel{position:fixed;left:8px;right:8px;bottom:150px;
    background:rgba(38,30,22,.97);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px 16px;backdrop-filter:blur(8px);}
  #savePanel,#autoPanel,#panel{overflow-y:auto;overflow-x:hidden;}
  #saveMsg{font-size:12px;line-height:1.6;color:var(--sawn-dim);margin-bottom:10px;}
  /* 保存は本数が記録に残る場面なので、ここでも確認をうながす */
  #saveCaution{font-size:11.5px;line-height:1.55;color:#E8A96B;
    border-top:1px solid var(--line);padding-top:9px;margin-bottom:12px;}
  /* 案内の帯は薄く。写真が少しでも多く見えるように(2026-09-19) */
  #autoPanel{position:fixed;left:8px;right:8px;bottom:150px;
    background:rgba(38,30,22,.97);border:1px solid var(--line);border-radius:16px;
    padding:8px 14px 10px;backdrop-filter:blur(8px);}
  #autoMsg{font-size:12px;line-height:1.45;color:var(--sawn);margin-bottom:8px;}
  #autoMsg b{color:var(--paint);font-size:17px;}
  .act{flex:1;background:var(--paint);color:var(--paint-ink);border:none;border-radius:10px;
    padding:11px 4px;font-size:13px;font-weight:700;}
  /* 以前は文字も枠も暗く、押せるように見えなかった。はっきりさせる(2026-09-19) */
  .act.ghost{background:#3A2C1F;color:var(--sawn);border:1px solid #6B5334;flex:0 0 80px;font-weight:700;}
  .act.ghost:active{background:#4A392A;}
  .sub{flex:1;background:none;color:var(--sawn-dim);border:1px dashed var(--line);
    border-radius:10px;padding:9px 4px;font-size:11.5px;}
  .sub:active{color:#00C6FF;border-color:#2A5A6B;}
  .act.ghost2{background:var(--bark-2);color:#00C6FF;border:1px solid #2A5A6B;}
  #guessVal{width:46px;text-align:right;font-size:12px;color:var(--sawn-dim);}
  /* 押している最中の見せ方は全部のボタンで同じにする。
     消すモードだけ塗りつぶしていて浮いていた(2026-09-20)。
     いま消せる状態かは、写真の下に出る赤い帯で分かる */
  #bar button.on,#bar button.erasing{border-color:var(--paint);color:var(--paint);}
  /* 案内の帯は**写真の下**に出す。以前は画面の上に固定していたが、
     「この範囲に決定」が指から遠く、写真の上の方も隠していた(2026-09-17に移動)。
     下のバーのすぐ上に置く。位置は placePanels() が合わせる。 */
  #eraseBanner{position:fixed;left:0;right:0;bottom:0;padding:11px 8px;
    background:#7A1D12;color:#FFE3DA;font-size:15px;text-align:center;font-weight:700;letter-spacing:.05em;}
  #roiBanner{position:fixed;left:0;right:0;bottom:0;padding:7px 14px 9px;
    background:rgba(4,34,43,.96);color:#EAF7FB;backdrop-filter:blur(6px);}
  #roiMsg{font-size:12px;font-weight:700;text-align:center;line-height:1.4;}
  #roiCount{font-size:11px;color:#7FDCEF;text-align:center;margin-top:2px;font-variant-numeric:tabular-nums;}
  #roiBanner .act{padding:8px 4px;font-size:12px;}
  #roiBanner .act:disabled{opacity:.45;}
  /* 囲いの帯は背景が濃い青なので、そこに合う明るさにする */
  #roiBanner .act.ghost{background:#0E4353;color:#EAF7FB;border-color:#3E8BA5;}
  #roiBanner .act.ghost:active{background:#165F75;}

  /* 見た目パネル */
  #panel{position:fixed;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom));
    background:rgba(38,30,22,.97);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px 16px;backdrop-filter:blur(8px);}
  /* 範囲を囲った後。囲んだ形を確かめられるよう、写真を隠さない細い帯で出す */
  #roiGo{position:fixed;left:8px;right:8px;bottom:150px;display:flex;gap:8px;
    max-width:420px;margin:0 auto;}
  #roiGo .act{padding:14px 4px;font-size:14px;}
  #roiGo .act.ghost{flex:0 0 96px;}

  /* 電卓。荷台ごとの本数を足したい時などに使う */
  #calcPanel{position:fixed;left:8px;right:8px;bottom:150px;
    background:#000;border:1px solid #333;border-radius:16px;
    padding:12px 14px 14px;max-width:420px;margin:0 auto;
    display:flex;flex-direction:column;}
  #calcPanel .grab::before{background:#3A3A3A;}
  #calcPanel .grab.hot::before{background:var(--calc-op);}
  #calcTop{display:flex;align-items:center;gap:10px;}
  #calcHistBtn{flex:none;background:#161616;color:#9A9A9A;
    border:1px solid #333;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;}
  #calcHistBtn.on{color:var(--calc-op);border-color:var(--calc-op);}
  #calcExpr{flex:1;min-width:0;text-align:right;font-size:26px;font-weight:700;color:#FFF;
    min-height:36px;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    overflow-x:auto;scrollbar-width:none;}
  #calcExpr::-webkit-scrollbar{display:none;}
  /* 履歴。押すと数字を打ち直さずに続きから計算できる */
  #calcHist{max-height:246px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
  #calcHist .hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    background:#1C1C1C;border:1px solid #333;border-radius:10px;
    padding:12px 13px;font-variant-numeric:tabular-nums;width:100%;text-align:left;}
  #calcHist .hrow .he{font-size:14px;color:#9A9A9A;overflow:hidden;white-space:nowrap;}
  #calcHist .hrow .hr{font-size:20px;font-weight:700;color:#FFF;flex:none;}
  #calcHist .empty{color:#8C8C8C;font-size:14px;text-align:center;padding:26px 0;}
  #calcHist .clear{background:none;border:1px dashed #444;color:#9A9A9A;
    border-radius:10px;padding:11px 4px;font-size:13px;}
  #calcDisp{min-width:0;text-align:right;font-size:20px;font-weight:600;color:#8C8C8C;
    letter-spacing:0;font-variant-numeric:tabular-nums;margin:2px 0 12px;
    min-height:30px;overflow:hidden;white-space:nowrap;}
  #calcDisp.answer{font-size:46px;font-weight:800;color:#FFF;letter-spacing:-.02em;
    line-height:1.05;}
  #calcKeys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
    flex:0 1 auto;min-height:0;grid-auto-rows:1fr;}   /* 伸びはせず、狭い時だけ縮む */
  .ck{background:#1C1C1C;color:#FFF;border:1px solid #333;
    border-radius:12px;padding:16px 2px;font-size:25px;font-weight:600;
    font-variant-numeric:tabular-nums;min-height:0;overflow:hidden;}
  .ck:active{background:#333;}
  .ck.op{color:var(--calc-op);border-color:#6A5320;}
  .ck.fn{color:#9A9A9A;font-size:21px;}
  .ck.eq{background:var(--calc-op);color:#241D04;border-color:var(--calc-op);
    grid-row:span 2;}
  .ck.wide{grid-column:span 2;}

  /* パネル上部の摘み。タップするか、下へ引き下げると閉じる */
  .grab{height:26px;margin:-12px -16px 2px;display:flex;align-items:center;
    justify-content:center;touch-action:none;cursor:grab;}
  .grab::before{content:'';width:46px;height:5px;border-radius:3px;
    background:var(--line);transition:background .15s,width .15s;}
  .grab.hot::before{background:var(--paint);width:56px;}
  .row{display:flex;align-items:center;gap:12px;}
  .row+.row{margin-top:10px;}
  .lab{font-size:12px;color:var(--sawn-dim);width:52px;flex:none;letter-spacing:.06em;}
  #swatches{display:flex;gap:10px;flex:1;}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;flex:none;padding:0;}
  .sw[aria-pressed="true"]{border-color:var(--sawn);box-shadow:0 0 0 3px rgba(233,220,196,.18);}
  input[type=range]{flex:1;accent-color:var(--paint);height:34px;}
  #preview{width:44px;flex:none;display:flex;align-items:center;justify-content:center;}
  /* 3つとも同じ形・同じ大きさにそろえる。文字数で幅が変わると
     並びがばらついて見える(2026-09-20) */
  #togNum,#togSnd,#togFit{flex:1;background:var(--bark-2);color:var(--sawn-dim);border:1px solid var(--line);
    border-radius:999px;padding:8px 16px;font-size:12px;font-weight:600;}
  #togNum.on,#togSnd.on,#togFit.on{color:var(--paint);border-color:var(--paint);}

  /* 写真の上に少しの間だけ出る知らせ。どんな写真の上でも読めるよう帯を敷く */
  #hint{position:fixed;left:0;right:0;bottom:88px;text-align:center;font-size:12px;
    color:var(--sawn-dim);pointer-events:none;transition:opacity .4s;padding:0 10px;}
  #hint span{display:inline-block;background:rgba(30,22,16,.94);border:1px solid var(--line);
    border-radius:999px;padding:7px 15px;line-height:1.5;max-width:100%;
    backdrop-filter:blur(6px);}
  #hint span.multi{border-radius:14px;padding:9px 16px 10px;}
  #hint i{display:block;font-style:normal;margin-top:6px;padding-top:6px;
    border-top:1px solid var(--line);color:#E8A96B;font-size:11px;line-height:1.55;}
  #busy{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(30,22,16,.7);font-size:14px;color:var(--sawn-dim);}
  input[type=file]{display:none;}
  .hide{display:none !important;}
  :focus-visible{outline:2px solid var(--paint);outline-offset:2px;}
</style>
</head>
<body>

<div id="app">
<div id="stage"><canvas id="cv"></canvas></div>

<div id="count" class="hide"><b id="num">0</b><span>本</span><span id="countBreak" class="hide"></span></div>

<div id="topRight">

      <path d="M 6.21 17.57 A 14 14 0 0 1 33.79 17.57" fill="none" stroke="currentColor"

      <line x1="8.5" y1="6.8" x2="15.5" y2="6.8"/>
      <circle cx="9.2" cy="11.6" r="1.15" fill="currentColor" stroke="none"/>

  <button id="ver" aria-label="設定を開く"></button>
</div>

<div id="empty">
  <h1>原木カウンター</h1>
  <p><b>AIが木口を見つけて数えます。</b><br>
     写真を選んだら「自動」→「数える」。<br>
     抜けや余分は指でタップして直せます。</p>
  <div id="emptyBtns">
    <button class="big" id="shootBig">写真を撮る</button>
    <button class="big ghost" id="pickBig">写真を選ぶ</button>
  </div>
</div>

<div id="hint" class="hide">2本指で拡大・移動／消すときは「消す」をオンに</div>

<div id="panel" class="hide">
  <div class="grab" aria-label="つまんで下げると閉じます"></div>

  </div>

    <span class="lab">音</span>
    <button id="togSnd" class="on">タップ音を鳴らす</button>
  </div>
</div>

<!-- 下のバー。よく使う5つだけを1段に出す。
     以前は8個を2段に並べていて、横持ちにすると画面の36%を占めていた。
     残りの3つは「⋯」で下から出す(2026-09-17)。 -->
<div id="bar" class="hide">
  <button id="pick"><i>🖼</i>写真</button>
  <button id="auto"><i>🤖</i>自動</button>
  <button id="fit"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3H3v6"/><path d="M3 3l7 7"/><path d="M15 3h6v6"/><path d="M21 3l-7 7"/><path d="M9 21H3v-6"/><path d="M3 21l7-7"/><path d="M15 21h6v-6"/><path d="M21 21l-7-7"/></svg></i>全体</button>
  <button id="erase"><i><svg viewBox="0 0 24 24" aria-hidden="true">
    <!-- 消しゴム。写真や自動の絵文字と同じように、色で一目で分かるようにする -->
    <path d="M8.6 20.5 3.5 15.4a1.6 1.6 0 0 1 0-2.3L12.9 3.7a1.6 1.6 0 0 1 2.3 0l5.1 5.1a1.6 1.6 0 0 1 0 2.3l-9.4 9.4z"
          fill="#FF8FA3" stroke="#8E2C41" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M7.6 8.9 15.1 16.4 10.9 20.5 3.5 15.4a1.6 1.6 0 0 1 0-2.3z"
          fill="#E6E6E6" stroke="#8E2C41" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M8.6 20.5H21" stroke="#8E2C41" stroke-width="1.9" stroke-linecap="round"/>
  </svg></i>消す</button>
  <button id="save"><i>⬇</i>保存</button>
  <button id="more"><i>⋯</i>その他</button>
</div>

<div id="morePanel" class="hide">
  <div class="grab" aria-label="つまんで下げると閉じます"></div>
  <div class="row" style="gap:8px">
    <button id="clear" class="act ghost2"><i>✕</i>全消去</button>

  <div class="row" style="gap:8px">
    <button id="undo" class="act ghost2"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h10a5.5 5.5 0 0 1 0 11h-4"/><path d="M8 5.5 3.5 10 8 14.5"/></svg></i>戻す</button>
    <button id="openSet" class="act ghost2"><i>⚙</i>設定</button>
  </div>
</div>

<div id="autoPanel" class="hide">
  <div class="grab" aria-label="つまんで下げると閉じます"></div>
  <div id="autoMsg">だいたいの本数を合わせて「数える」を押してください。</div>
  <div class="row" id="guessRow">
    <span class="lab">本数</span>
    <input type="range" id="guess" min="5" max="300" step="1" value="40">
    <span id="guessVal">40本</span>
  </div>
  <div class="row" style="gap:8px">
    <button id="redo" class="act">数える</button>
  </div>
  <div class="row" style="margin-top:10px">

    <button id="roiAll" class="sub hide">範囲を解除</button>

</div>

<div id="savePanel" class="hide">

    <div id="saveCaution">この本数で記録に残ります。相違ないかご確認ください</div>

  <div id="saveBtns">

      <button id="savePng" class="act">画像を保存</button>

    <div class="row" style="gap:8px">
      <button id="saveData" class="act ghost2">学習データを保存</button>
    </div>

</div>

<div id="roiGo" class="hide">

<!-- 版バッジを押した時。いまの状態だけを出す(2026-09-19) -->
<div id="statusPanel" class="hide">
  <div class="grab" aria-label="つまんで下げると閉じます"></div>

<div id="eraseBanner" class="hide">消すモード：消したい印をタップ</div>
<div id="roiBanner" class="hide">
  <div id="roiMsg">写真の上を指でタップして、範囲の角を順番に囲んでください</div>
  <div id="roiCount">0点</div>
  <div class="row" style="gap:6px;margin-top:6px">

    <button id="roiFinish" class="act" disabled>この範囲に決定</button>

  </div>
</div>
<div id="busy" class="hide">写真を読み込み中…</div>
<input type="file" id="file" accept="image/*">
</div><!-- /#app -->

<script>
/* 画面の隅に出す版の表示。sw.js の CACHE の番号と必ず揃えること。
   ここを直し忘れると、中身が新しくても古い版に見えてしまう。 */
const APP_VER='v74';
document.getElementById('ver').textContent=APP_VER;

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const fileInput=document.getElementById('file');
const bar=document.getElementById('bar'), emptyBox=document.getElementById('empty');
const countBox=document.getElementById('count'), numEl=document.getElementById('num');
const hint=document.getElementById('hint'), panel=document.getElementById('panel');
const busy=document.getElementById('busy');

let img=null, curURL=null, marks=[], view={s:1,x:0,y:0};
let showNums=true, markScale=1.0, markColor='#FF5A1F', dpr=1;
let fitS=1, soundOn=true, ac=null, eraseMode=false;

const COLORS=['#FF5A1F','#FF2D95','#FFD400','#7CFF3B','#00C6FF','#FFFFFF'];

/* 明るい色の上では数字を黒にする */
function textOn(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)>170 ? '#000000' : '#FFFFFF';
}
function rgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(cv.clientWidth*dpr); cv.height=Math.round(cv.clientHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(img) fitS=Math.min(cv.clientWidth/img.width, cv.clientHeight/img.height);
  draw();
}
/* 画面の大きさや向きが変わった時。

   ここで**写真を置き直さないと、縦の時の拡大率と位置のまま残る**。
   端末を横にしたのに写真が小さいまま隅に寄っている、という状態になっていた
   (2026-09-17に修正)。

   ・全体表示で見ていた → そのまま全体表示にし直す
   ・拡大して見ていた   → 見ていた場所を画面の真ん中に保ったまま、はみ出しを直す */
function refitAfterResize(){
  if(!img) return;
  const wasFit = Math.abs(view.s - fitS) < fitS*0.02;   // 全体表示で見ていたか
  const mid = toImage(cv.clientWidth/2, cv.clientHeight/2);   // 画面の真ん中に写っていた場所
  resize();                                            // ここで fitS が新しくなる
  if(wasFit || view.s < fitS){
    fitView();
  }else{
    view.x = cv.clientWidth/2  - mid.x*view.s;
    view.y = cv.clientHeight/2 - mid.y*view.s;
    clampView(); draw();
  }
}
function reflow(){
  // 端末が本当に横になったら、こちらで回すのはやめる（二重に回ってしまうため）
  if(land && innerWidth > innerHeight){ setLand(false); return; }
  if(land) applyLand();
  shortScreen();
  refitAfterResize();
  fitTopBar(); placePanels(); labelRot();
}
/* 端末そのものを回した直後は、まだ**前の大きさ**が返ってくることがある
   (Android Chromeで実際に起きる。URLバーの出入りでも同じ)。
   その値で組んだままだと、電卓が入る高さを取り違えて右上のボタンに被る。
   少し置いてからもう一度測り直す(2026-09-21)。 */
let reflowTimer=0;
function reflowSoon(){
  clearTimeout(reflowTimer);
  reflowTimer=setTimeout(reflow, 350);
}
window.addEventListener('resize',()=>{ reflow(); reflowSoon(); });
window.addEventListener('orientationchange',()=>{ reflow(); reflowSoon(); });
if(window.visualViewport) visualViewport.addEventListener('resize', reflowSoon);
/* 横向きのように**背の低い画面**では、パネルを薄くする(下のCSS body.short) */
function shortScreen(){
  const h = land ? innerWidth : innerHeight;
  document.body.classList.toggle('short', h < 520);
}

function fitView(){
  if(!img) return;
  const w=cv.clientWidth, h=cv.clientHeight;
  fitS=Math.min(w/img.width,h/img.height);
  view.s=fitS;
  view.x=(w-img.width*view.s)/2;
  view.y=(h-img.height*view.s)/2;
  draw();
}
/* 写真が画面外へ飛んでいかないように位置を制限 */
function clampView(){
  if(!img) return;
  const w=cv.clientWidth, h=cv.clientHeight;
  const iw=img.width*view.s, ih=img.height*view.s;
  const mx=Math.min(70,iw*0.5), my=Math.min(70,ih*0.5);
  view.x=Math.min(w-mx, Math.max(mx-iw, view.x));
  view.y=Math.min(h-my, Math.max(my-ih, view.y));
}
function toScreen(p){return {x:p.x*view.s+view.x, y:p.y*view.s+view.y};}
function toImage(x,y){return {x:(x-view.x)/view.s, y:(y-view.y)/view.s};}

function draw(){
  ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  if(!img) return;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(img, view.x, view.y, img.width*view.s, img.height*view.s);
  const R=markRadius(), tc=textOn(markColor);
  /* 番号は、印の中に収まる時だけ全部に振る。
     小さくて収まらない時は**10本ごと**だけにする。
     全部に振ると数字が重なって読めなくなるが、10本ごとなら区切りが分かり、
     目で追って確かめられる。 */
  const numAll = showNums && R>=9;
  const numTen = showNums && !numAll && R>=4;
  marks.forEach((m,i)=>{
    const p=toScreen(m);
    if(p.x<-R||p.y<-R||p.x>cv.clientWidth+R||p.y>cv.clientHeight+R) return;
    const ten = (i+1)%10===0;
    ctx.beginPath(); ctx.arc(p.x,p.y,R,0,7);
    ctx.fillStyle=rgba(markColor,.42); ctx.fill();
    ctx.lineWidth=Math.max(1.5,R*0.2); ctx.strokeStyle=markColor; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x,p.y,R,0,7); ctx.lineWidth=1; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.stroke();
    if(numTen && ten){
      // 10本ごとの区切り。印の外側に白い輪を足して、数字は読める大きさで出す
      ctx.beginPath(); ctx.arc(p.x,p.y,R+2.5,0,7);
      ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.stroke();
    }
    if(numAll || (numTen && ten)){
      const fs = numAll ? Math.round(R*0.9) : 11;
      ctx.font=`700 ${fs}px Roboto, sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=Math.max(2,fs*0.25);
      ctx.strokeStyle=tc==='#000000'?'rgba(255,255,255,.75)':'rgba(0,0,0,.7)';
      ctx.strokeText(i+1,p.x,p.y+1);
      ctx.fillStyle=tc; ctx.fillText(i+1,p.x,p.y+1);
    }
  });
  // 打った点をつないで輪郭を描く（描いている途中）
  if(roiMode && roiDraft.length>0){
    ctx.beginPath();
    const p0=toScreen(roiDraft[0]); ctx.moveTo(p0.x,p0.y);
    for(let i=1;i<roiDraft.length;i++){ const p=toScreen(roiDraft[i]); ctx.lineTo(p.x,p.y); }
    ctx.lineWidth=3; ctx.strokeStyle='#00C6FF'; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
    // 打った点そのものにも印をつける（次にどこを打ったか分かるように）
    roiDraft.forEach((pt,i)=>{
      const p=toScreen(pt);
      ctx.beginPath(); ctx.arc(p.x,p.y,i===0?7:5,0,7);
      ctx.fillStyle= i===0 ? '#FFD400' : '#00C6FF';
      ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#04222B'; ctx.stroke();
    });
  }
  if(roi && roi.points && roi.points.length>2){
    // 「全体の四角」から「囲んだ形」をくり抜いて塗る＝外側だけが暗くなる（合成モードを使わない確実な方法）
    ctx.beginPath();
    ctx.rect(0,0,cv.clientWidth,cv.clientHeight);
    const q0=toScreen(roi.points[0]); ctx.moveTo(q0.x,q0.y);
    for(let i=1;i<roi.points.length;i++){ const p=toScreen(roi.points[i]); ctx.lineTo(p.x,p.y); }
    ctx.closePath();
    ctx.fillStyle='rgba(10,7,5,.55)';
    ctx.fill('evenodd');
    // 囲んだ形の輪郭
    ctx.beginPath();
    ctx.moveTo(q0.x,q0.y);
    for(let i=1;i<roi.points.length;i++){ const p=toScreen(roi.points[i]); ctx.lineTo(p.x,p.y); }
    ctx.closePath();
    ctx.setLineDash([8,6]); ctx.lineWidth=2.5; ctx.strokeStyle='#00C6FF'; ctx.stroke(); ctx.setLineDash([]);
  }
  if(false&&guide&&logR){
    const rr=logR*view.s, cx=cv.clientWidth/2, cy=cv.clientHeight/2;
    ctx.setLineDash([6,5]); ctx.lineWidth=2.5; ctx.strokeStyle='#FFD400';
    ctx.beginPath(); ctx.arc(cx,cy,rr,0,7); ctx.stroke(); ctx.setLineDash([]);
    ctx.font='700 12px Roboto, sans-serif'; ctx.textAlign='center';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.7)';
    ctx.strokeText('木口1本の大きさの目安', cx, cy-rr-10);
    ctx.fillStyle='#FFD400'; ctx.fillText('木口1本の大きさの目安', cx, cy-rr-10);
  }
}
/* 印の大きさは、写真に写っている木口の大きさに合わせる。

   以前は画面の画素で固定(11px)していた。すると土場の山のように木口が小さく写る
   写真では、印が木口の2倍以上になって重なり合い、**一つの塊にしか見えなくなる**。
   128本の写真で実測したところ、木口9.1px に対して印22px(2.4倍)だった。
   「AIが数えた目安です。必ずご自身の目で確かめてください」と出しているのに、
   確かめられない状態だった(2026-09-17に修正)。

   木口の大きさは、隣り合う印の距離から測る(密に並ぶので、最近傍距離≒木口の直径)。 */
/* AIが何本出して、自分で何本足した/消したかを残す。
   荷渡しの場で「この数字は信用できるか」を判断する材料になる(2026-09-17)。 */
let aiCount=null, addCount=0, delCount=0;
function resetTally(){ aiCount=null; addCount=0; delCount=0; }

let logSpan=0;            // 木口の間隔(元画像の画素)。測れない時は0
/* **一度測ったら変えない。**
   タップするたびに測り直していたため、印を足すたびに全部の印の大きさが
   わずかに変わり、落ち着かなかった(2026-09-19に指摘を受けた)。
   写真を替えた時と、AIで数え直した時だけ測り直す(force=true)。 */
function measureSpan(force){
  const n=marks.length;
  if(n<3){ if(force) logSpan=0; return; }
  if(!force && logSpan>0) return;
  // 数が多い時は間引いて測る(全部見ると重い)
  const step=Math.max(1,Math.floor(n/120));
  const a=[]; for(let i=0;i<n;i+=step) a.push(marks[i]);
  const d=[];
  for(let i=0;i<a.length;i++){
    let best=Infinity;
    for(let j=0;j<marks.length;j++){
      if(marks[j]===a[i]) continue;
      const q=Math.hypot(a[i].x-marks[j].x, a[i].y-marks[j].y);
      if(q<best) best=q;
    }
    if(isFinite(best)) d.push(best);
  }
  if(!d.length){ logSpan=0; return; }
  d.sort((x,y)=>x-y);
  logSpan=d[d.length>>1];
}
/* 画面に描く時の印の半径。

   fitMark=true  … 写真に写っている木口に合わせる(既定)
   fitMark=false … 木口とは無関係に、自分で決めた大きさにする

   どちらも**拡大すると一緒に大きくなる**(印が木口からずれないように)。 */
let fitMark=true;
let manualBase=11;        // 自分で決める時の半径(全体表示に直した画素)
function markRadius(){
  const base = (fitMark && logSpan>0)
    ? logSpan*view.s*0.45                          // 木口に合わせる
    : manualBase*(fitS>0 ? view.s/fitS : 1);       // 自分で決める(写真が変わっても大きさは変えない)
  return Math.max(2, Math.min(60, base*markScale));
}
function updateCount(){
  numEl.textContent=marks.length;
  const el=document.getElementById('countBreak');
  if(aiCount===null || (!addCount && !delCount)){
    el.classList.add('hide');
  }else{
    el.textContent = `AI ${aiCount}` + (addCount?` +${addCount}`:'') + (delCount?` −${delCount}`:'');
    el.classList.remove('hide');
  }
  measureSpan();
}

/* ---- タップ・ピンチ操作 ---- */
const pts=new Map();
let start=null, moved=false, pinch=null;

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  const q=appPt(e);
  pts.set(e.pointerId,{x:q.x,y:q.y});
  if(pts.size===1){ start={x:q.x,y:q.y}; moved=false; }
  else if(pts.size===2){
    const [a,b]=[...pts.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2};
    moved=true;
  }
});
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!img) return;
  const prev=pts.get(e.pointerId);
  const q=appPt(e);
  pts.set(e.pointerId,{x:q.x,y:q.y});
  if(pts.size===1){
    const dx=q.x-prev.x, dy=q.y-prev.y;
    if(Math.hypot(q.x-start.x,q.y-start.y)>10) moved=true;
    if(moved){ view.x+=dx; view.y+=dy; clampView(); draw(); }
  }else if(pts.size===2&&pinch){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    const ns=Math.max(fitS, Math.min(fitS*40, view.s*(d/pinch.d)));
    const k=ns/view.s;
    view.x=cx-(pinch.cx-view.x)*k;
    view.y=cy-(pinch.cy-view.y)*k;
    view.s=ns;
    clampView();
    pinch={d,cx,cy};
    draw();
  }
});
function up(e){
  if(!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if(pts.size===0){
    if(!moved&&img){ const q=appPt(e); tap(q.x,q.y); }
    pinch=null;
  }else if(pts.size===1){
    pinch=null; moved=true;
    const p=[...pts.values()][0]; start={x:p.x,y:p.y};
  }
}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);

function tap(x,y){
  // 回している時 getBoundingClientRect は画面基準の外枠を返すので使えない。
  // 並びの位置(offsetLeft/Top)は回転の影響を受けないのでこちらを使う。
  const sx=x-cv.offsetLeft, sy=y-cv.offsetTop;
  if(roiMode){
    roiDraft.push(toImage(sx,sy));
    updateRoiBanner();
    draw();
    return;
  }
  if(eraseMode){
    const hit=Math.max(markRadius()+10,24);
    for(let i=marks.length-1;i>=0;i--){
      const p=toScreen(marks[i]);
      if(Math.hypot(p.x-sx,p.y-sy)<hit){ marks.splice(i,1); delCount++; updateCount(); draw(); vib(30); beep('del'); return; }
    }
    return; // 印のない所をタップしても何も起きない
  }
  marks.push(toImage(sx,sy)); addCount++; updateCount(); draw();
  // 10本ごとは振動でも区切りが分かるようにする（音が使えない現場向け）
  const ten = marks.length%10===0;
  vib(ten ? [18,60,18] : 12);
  beep(ten?'ten':'add');
}
function vib(ms){ if(navigator.vibrate) navigator.vibrate(ms); }

/* 音を出せる状態にしておく。
   スマホは「画面を触った時」でないと音を許してくれないので、
   最初のタップで先に用意しておく。
   ここを踏まないと、鳴らそうとした時にはもう手遅れになる。 */
function unlockAudio(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state!=='running') ac.resume();
  }catch(_){}
}
addEventListener('pointerdown', unlockAudio, {once:true});
addEventListener('touchstart', unlockAudio, {once:true});

/* タップ音：10本ごとに高い音で区切りが分かる */
function beep(kind){
  if(!soundOn) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state!=='running'){
      // まだ動いていない時は、動き出してから鳴らす。
      // resume() は非同期なので、待たずに時刻を取ると「過去」を指してしまい無音になる
      ac.resume().then(()=>ring(kind)).catch(()=>{});
      return;
    }
    ring(kind);
  }catch(_){}
}
function ring(kind){
  try{
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type= kind==='del' ? 'sawtooth' : 'square';
    const f= kind==='del' ? 300 : kind==='ten' ? 1320 : 880;
    o.frequency.setValueAtTime(f,t);
    if(kind==='ten') o.frequency.setValueAtTime(1760,t+0.05);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.4,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==='ten'?0.16:0.08));
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+(kind==='ten'?0.18:0.1));
  }catch(_){}
}

/* ---- 写真の読み込み ---- */
async function decode(file){
  if(window.createImageBitmap){
    try{ return {bmp:await createImageBitmap(file,{imageOrientation:'from-image'}), url:null}; }catch(_){}
  }
  const url=URL.createObjectURL(file);
  const el=await new Promise((res,rej)=>{
    const i=new Image();
    i.onload=()=>res(i);
    i.onerror=()=>rej(new Error('画像をデコードできません'));
    i.src=url;
  }).catch(err=>{ URL.revokeObjectURL(url); throw err; });
  return {bmp:el, url};
}

async function load(file){
  busy.classList.remove('hide');
  try{
    const {bmp,url}=await decode(file);
    const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight;
    if(!w||!h){ if(url) URL.revokeObjectURL(url); throw new Error('サイズ0の画像'); }
    if(img&&img.close) img.close();
    if(curURL) URL.revokeObjectURL(curURL);
    img=bmp; curURL=url;
    marks=[]; view={s:1,x:0,y:0}; resetTally(); logSpan=0; updateCount();
    // 横向きの指定はそのまま引き継ぐ（同じ現場で続けて撮るため）
    gdata=null; roi=null; lastRoi=null; roiMode=false; roiDraft=[]; guide=false;
    document.getElementById('roiGo').classList.add('hide');
    showRoiSet(false);
    logR=0;
    document.getElementById('autoPanel').classList.add('hide');
    eraseMode=false;
    document.getElementById('erase').classList.remove('erasing');
    document.getElementById('eraseBanner').classList.add('hide');
    document.body.classList.remove('erasing');
    emptyBox.classList.add('hide');
    bar.classList.remove('hide');
    countBox.classList.remove('hide');
    flash(wideHint() || '2本指で拡大・移動／消すときは「消す」をオンに', wideHint()?6000:4000);
    resize(); fitView(); placePanels();
    loadAI().then(ok=>{
      const v=document.getElementById('ver');
      v.textContent = APP_VER+(ok ? ' ○' : ' ×');
      v.style.color = ok ? '#7CFF3B' : '#FF8A5C';
    });
  }finally{
    busy.classList.add('hide');
  }
}

let loading=false;
let fromCamera=false;   // カメラで撮った写真か（撮った写真は手元に残す）
fileInput.addEventListener('change',async e=>{

  if(!f||loading) return;

    }
  }catch(err){

    alert('この写真は読み込めませんでした。\n形式がHEICなどの場合はJPEGで撮り直すか、ギャラリーで一度編集・保存してから選んでください。');
  }finally{
    loading=false;
    fromCamera=false;
    busy.classList.add('hide'); busy.textContent='写真を読み込み中…';

});

/* 押してもパネルは閉じない。何本も戻したい時に押し直さずに済む */

/* あまり使わない3つは「その他」にまとめた。

/* ---- 横向きで見る ----

   端末の回転ロックを掛けていると、傾けても画面は縦のまま。
   そこで **画面ぜんぶ(#app)を90度回す**。写真だけでなくボタン・パネル・帯も
   一緒に回るので、端末を傾ければそのまま横向きの道具として使える。

   最初は写真だけ回していたが、ボタンや文字が縦のままで読みづらかった(2026-09-17に改めた)。

   写真そのものやAIに渡す向きは変えない(学習は正しい向きで行っているため)。 */
const appEl=document.getElementById('app'), rotBtn=document.getElementById('rotate');
const rotFace=document.getElementById('rotFace');
let land=false;                                  // 画面ぜんぶを回して横向きにしているか

/* いま横向きで見えているか。端末が横になっている場合も含む。 */
function isLand(){ return land || innerWidth > innerHeight; }

/* ボタンの表示は「押したらこうなる」方。
   縦で見ている時は「横」、横で見ている時は「縦」。 */
function labelRot(){
  const L=isLand();
  rotFace.textContent = L ? '縦' : '横';
  rotBtn.classList.toggle('on', L);
  rotBtn.setAttribute('aria-label', L ? '縦向きにする' : '横向きにする');
}

function applyLand(){
  if(land){
    // 端末のURLバーで 100vh がずれるので、実寸を入れる
    appEl.style.width=innerHeight+'px';
    appEl.style.height=innerWidth+'px';
    appEl.style.transform=`rotate(90deg) translateY(${-innerWidth}px)`;
  }else{
    appEl.style.width=''; appEl.style.height=''; appEl.style.transform='';
  }
  document.body.classList.toggle('landscape', land);
  shortScreen();          // パネルを薄くする判定は、回した直後にすぐ効かせる
  labelRot();
}

/* 指の位置を、回した後の画面の座標に直す。
   画面ぜんぶを回しているので、指の座標(clientX/Y)はそのままでは使えない。 */
function appPt(e){
  return land ? {x:e.clientY, y:innerWidth-e.clientX} : {x:e.clientX, y:e.clientY};
}

function setLand(on){
  if(land===on){ labelRot(); return; }
  land=on;
  applyLand();
  // その場で計算し直す。描画待ち(requestAnimationFrame)に入れると、
  // キャンバスの新しい大きさが確定する前に走ってしまい、縦の時の倍率が残る
  void cv.offsetWidth;          // 並びを確定させる
  resize(); fitView(); placePanels();
}

/* 向きの切り替え。

   **全画面＋端末の向きの固定は使わない。**
   その方式だと、画像や学習データを保存した時にダウンロードで全画面が解除され、
   一緒に向きの固定も外れて勝手に縦へ戻ってしまう(2026-09-19に指摘を受けた)。
   画面ぜんぶを回すやり方なら、保存しても何をしても向きは変わらない。 */
rotBtn.onclick=()=>{
  closeMore();
  if(land){ setLand(false); flash('縦向きにしました', 2000); return; }
  if(innerWidth > innerHeight){
    // 端末そのものが横になっている。こちらで回すと逆に縦になってしまう
    flash('端末がすでに横向きです。縦にするには端末を戻してください', 3500);
    labelRot(); return;
  }
  setLand(true);
  flash('<b>端末を横に傾けて</b>ご覧ください。右上の「縦」で戻せます', 5000);
};

/* ================= 自動カウント v2 =================
   ・空/車体は色（赤み）で除外
   ・木口の大きさは利用者が指定（写真からの自動推定は当てにならない）
   ・多スケールのLoG（丸検出）で中心を拾う
   通信もライブラリも不要。 */
let gdata=null;                 // 縮小画像のキャッシュ
let roi=null, roiMode=false, roiDraft=[];   // roi.points は指でタップして作った輪郭（画像座標）
/* 数え終わると roi は消すが、学習データにはどこを囲ったかを残したいので取っておく。
   囲いの外に数えていない木口がある写真だと分かれば、後で正しく学習に使える。 */
let lastRoi=null;

/* 手描きの輪郭を、指定した幅・高さの塗り絵として焼き込む。
   1(内側)/0(外側)の判定に、ピクセルごとの計算ではなくCanvasの塗りつぶしを使う（速い）。 */
function rasterizePoly(points, w, h, scaleX, scaleY){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.beginPath();
  g.moveTo(points[0].x*scaleX, points[0].y*scaleY);
  for(let i=1;i<points.length;i++) g.lineTo(points[i].x*scaleX, points[i].y*scaleY);
  g.closePath(); g.fillStyle='#fff'; g.fill();
  return g.getImageData(0,0,w,h).data; // .data[i*4+3] > 0 なら内側
}
let logR=0;                     // 木口の半径（元画像の画素）
let guide=false;                // 大きさの目安の丸を表示中か

function prepGray(){
  const maxSide=900;
  const sc=Math.min(1, maxSide/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d',{willReadFrequently:true});
  g.drawImage(img,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data;
  const gray=new Float32Array(w*h), wood=new Uint8Array(w*h);
  for(let i=0,p=0;i<gray.length;i++,p+=4){
    const r=d[p],gg=d[p+1],b=d[p+2];
    gray[i]=(r*299+gg*587+b*114)/1000;
    wood[i]= (r-b)>10 ? 1:0;     // 木は赤み寄り、空は青寄り
  }
  gdata={gray,wood,w,h,sc};
}

/* ガウスぼかし（箱ぼかし3回で近似） */
function boxBlur(src,dst,w,h,r){
  const tmp=new Float32Array(w*h), inv=1/(2*r+1);
  for(let y=0;y<h;y++){
    const o=y*w; let acc=0;
    for(let x=-r;x<=r;x++) acc+=src[o+Math.min(w-1,Math.max(0,x))];
    for(let x=0;x<w;x++){
      tmp[o+x]=acc*inv;
      acc+=src[o+Math.min(w-1,x+r+1)]-src[o+Math.max(0,x-r)];
    }
  }
  for(let x=0;x<w;x++){
    let acc=0;
    for(let y=-r;y<=r;y++) acc+=tmp[Math.min(h-1,Math.max(0,y))*w+x];
    for(let y=0;y<h;y++){
      dst[y*w+x]=acc*inv;
      acc+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x];
    }
  }
}
function gaussian(src,w,h,sigma){
  const r=Math.max(1,Math.round(sigma*0.9));
  const a=new Float32Array(w*h), b=new Float32Array(w*h);
  boxBlur(src,a,w,h,r); boxBlur(a,b,w,h,r); boxBlur(b,a,w,h,r);
  return a;
}

function detect(sensV, R){
  const {gray,wood,w,h}=gdata;
  const mask=new Uint8Array(w*h);
  if(roi && roi.points && roi.points.length>2){
    const rd=rasterizePoly(roi.points, w, h, gdata.sc, gdata.sc);
    for(let i=0;i<w*h;i++) mask[i]=wood[i] && rd[i*4+3]>0 ? 1:0;
  }else{
    for(let i=0;i<w*h;i++) mask[i]=wood[i];
  }

  // 日向と日陰の明るさの差をならす（局所正規化）
  const rr=Math.max(2,Math.round(R*1.5));
  const mu=new Float32Array(w*h), sq=new Float32Array(w*h), mu2=new Float32Array(w*h);
  boxBlur(gray,mu,w,h,rr);
  for(let i=0;i<w*h;i++) sq[i]=gray[i]*gray[i];
  boxBlur(sq,mu2,w,h,rr);
  const gN=new Float32Array(w*h);
  for(let i=0;i<w*h;i++){
    const sd=Math.sqrt(Math.max(mu2[i]-mu[i]*mu[i],1));
    gN[i]=(gray[i]-mu[i])/sd*40+128;
  }

  // 多スケールLoG：木口の大小に対応
  const best=new Float32Array(w*h).fill(-1e9), bestR=new Float32Array(w*h);
  for(const f of [0.55,0.8,1.15,1.6]){
    const sg=Math.max(1,R*f/1.5);
    const B=gaussian(gN,w,h,sg), k=sg*sg;
    for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
      const i=y*w+x;
      if(!mask[i]) continue;
      const v=-(B[i-1]+B[i+1]+B[i-w]+B[i+w]-4*B[i])*k;
      if(v>best[i]){ best[i]=v; bestR[i]=R*f; }
    }
  }

  // 局所最大を候補にする
  const cand=[];
  for(let y=2;y<h-2;y++) for(let x=2;x<w-2;x++){
    const i=y*w+x, v=best[i];
    if(!mask[i]||v<=0) continue;
    let top=true;
    for(let dy=-2;dy<=2&&top;dy++) for(let dx=-2;dx<=2;dx++){
      if(best[i+dy*w+dx]>v){ top=false; break; }
    }
    if(top) cand.push([v,x,y,bestR[i]]);
  }
  if(!cand.length) return [];
  // 感度で強さのしきい値を決める
  const sorted=cand.map(c=>c[0]).sort((a,b)=>b-a);
  const cut=sorted[Math.min(sorted.length-1, Math.floor(sorted.length*(0.12+sensV*0.085)))];
  cand.sort((a,b)=>b[0]-a[0]);

  const peaks=[], cell=Math.max(4,R*0.8), grid=new Map();
  for(const [v,x,y,r] of cand){
    if(v<cut) break;
    const cx=(x/cell)|0, cy=(y/cell)|0; let ok=true;
    for(let a=-2;a<=2&&ok;a++) for(let b=-2;b<=2&&ok;b++){
      const l=grid.get((cx+a)+','+(cy+b)); if(!l) continue;
      for(const p of l){
        const dm=Math.max(p.r,r)*1.25;
        if((p.x-x)**2+(p.y-y)**2<dm*dm){ ok=false; break; }
      }
    }
    if(!ok) continue;
    const p={x,y,r}; peaks.push(p);
    const k2=cx+','+cy; if(!grid.has(k2)) grid.set(k2,[]); grid.get(k2).push(p);
    if(peaks.length>2500) break;
  }
  return peaks;
}


/* ================= 学習済みモデル(AI)で数える =================
   モデルが同じ場所に置いてあれば、そちらを使う。
   無ければ従来の画像処理に自動で切り替わる。 */
const MODEL_FILE='./genboku_yolox_int8.onnx';  // 差し替える時はここだけ変える
const AI_SIZE=960;                 // 学習時と同じ大きさ

/* AIライブラリ。以前は配信サイト(CDN)から取っていたが、同じ場所に置くように変えた。

   理由:
   ・sw.js は「外部サイトには一切手を出さない」決まりなので、CDNから取ったものは
     保存庫に入らず、圏外で動かなくなることがあった
   ・外部への通信が無くなるので、privacy.html を「送信しない」で書き切れる
   ・CDNが落ちても動く

   通信量は変わらない(同じファイルを、取りに行く先が変わるだけ)。
   ort/ の中身は onnxruntime-web 1.20.1 の dist から取った3つ。 */
const AI_LIB={ base:new URL('./ort/', location.href).href, file:'ort.min.mjs' };
let ort=null, session=null, aiReady=false, aiTried=false, aiError='';
let aiJob=null;   // 読み込み中の処理。2回目以降の呼び出しは、これが終わるのを待つ

function loadAI(){
  if(aiJob) return aiJob;      // すでに始まっていれば、その結果を待つ
  aiJob = loadAIOnce();
  return aiJob;
}
async function loadAIOnce(){
  aiTried=true;
  aiError='';
  const base=AI_LIB.base;

  try{
    const m=await import(base+AI_LIB.file);
    if(m && m.InferenceSession) ort=m;
    else if(window.ort) ort=window.ort;
  }catch(e){
    aiError='ライブラリ: '+String(e.message||e).slice(0,80);
  }

  if(!ort){
    if(!aiError) aiError='ライブラリを読めません';
    return false;
  }

  try{
    ort.env.wasm.wasmPaths=base;
    ort.env.wasm.numThreads=1;
    const res=await fetch(MODEL_FILE);
    if(!res.ok) throw new Error('モデルHTTP '+res.status);
    const buf=new Uint8Array(await res.arrayBuffer());
    if(buf.length<1000) throw new Error('モデルが小さい('+buf.length+')');
    session=await ort.InferenceSession.create(buf,{executionProviders:['wasm']});
    aiReady=true; aiError='';
  }catch(e){
    aiError='モデル: '+String(e.message||e).slice(0,120);
    aiReady=false;
  }
  return aiReady;
}

/* 写真を960x960の正方形に収める（余白は灰色で埋める）。

   YOLOXは【左上に詰めて・0〜255のまま・青緑赤(BGR)の順】で学習している。
   ここを間違えても画面にエラーは出ず、本数だけが静かにズレる。
   実測では色の順を間違えるだけで平均のズレが0.56本→0.71本に悪化した。 */
function letterbox(){
  const c=document.createElement('canvas'); c.width=AI_SIZE; c.height=AI_SIZE;
  const g=c.getContext('2d',{willReadFrequently:true});
  g.fillStyle='#727272'; g.fillRect(0,0,AI_SIZE,AI_SIZE);
  const sx=roi?roi.x0:0, sy=roi?roi.y0:0;
  const sw=roi?(roi.x1-roi.x0):img.width, sh=roi?(roi.y1-roi.y0):img.height;
  const r=Math.min(AI_SIZE/sw, AI_SIZE/sh);
  const dw=Math.round(sw*r), dh=Math.round(sh*r);
  const dx=0, dy=0;                       // 中央ではなく左上に詰める
  g.drawImage(img, sx,sy,sw,sh, dx,dy,dw,dh);
  // 手描きの範囲がある時は、外側をパディングと同じ灰色で塗りつぶす
  if(roi && roi.points && roi.points.length>2){
    g.save();
    g.beginPath();
    g.rect(0,0,AI_SIZE,AI_SIZE);
    g.moveTo(dx+(roi.points[0].x-sx)*r, dy+(roi.points[0].y-sy)*r);
    for(let i=roi.points.length-1;i>=0;i--)
      g.lineTo(dx+(roi.points[i].x-sx)*r, dy+(roi.points[i].y-sy)*r);
    g.closePath();
    g.fillStyle='#727272';
    g.fill('evenodd');
    g.restore();
  }
  const d=g.getImageData(0,0,AI_SIZE,AI_SIZE).data;
  const n=AI_SIZE*AI_SIZE, f=new Float32Array(3*n);
  for(let i=0,p=0;i<n;i++,p+=4){
    f[i]=d[p+2]; f[n+i]=d[p+1]; f[2*n+i]=d[p];   // 青・緑・赤の順。255で割らない
  }
  return {data:f, r, dx, dy, sx, sy};
}

/* モデルの出力から、重なりを整理して木口の中心を取り出す。

   出力は [1, 18900, 6] の形。18900個の候補それぞれに6つの数字が並ぶ:
     [中心x, 中心y, 幅, 高さ, 物体らしさ, 木口らしさ]
   厳しさと比べるのは「物体らしさ × 木口らしさ」。
   箱の位置はすでに960の中の座標になっている（計算し直す必要はない）。 */
function decodeAI(out, m, conf){
  const d=out.data, N=out.dims[1];
  const cand=[];
  for(let i=0;i<N;i++){
    const o=i*6;
    const s=d[o+4]*d[o+5];
    if(s<conf) continue;
    const cx=d[o], cy=d[o+1], w=d[o+2], h=d[o+3];
    cand.push({s,cx,cy,x1:cx-w/2,y1:cy-h/2,x2:cx+w/2,y2:cy+h/2});
  }
  cand.sort((a,b)=>b.s-a.s);
  const keep=[];
  for(const b of cand){
    let ok=true;
    for(const k of keep){
      const iw=Math.min(b.x2,k.x2)-Math.max(b.x1,k.x1);
      const ih=Math.min(b.y2,k.y2)-Math.max(b.y1,k.y1);
      if(iw<=0||ih<=0) continue;
      const inter=iw*ih;
      const uni=(b.x2-b.x1)*(b.y2-b.y1)+(k.x2-k.x1)*(k.y2-k.y1)-inter;
      if(inter/uni>0.45){ ok=false; break; }
    }
    if(ok) keep.push(b);
    if(keep.length>3000) break;
  }
  // 元の写真の座標に戻す
  return keep.map(b=>({ x: m.sx+(b.cx-m.dx)/m.r, y: m.sy+(b.cy-m.dy)/m.r }));
}

async function runAI(conf){
  const m=letterbox();
  const t=new ort.Tensor('float32', m.data, [1,3,AI_SIZE,AI_SIZE]);
  const feeds={}; feeds[session.inputNames[0]]=t;
  const res=await session.run(feeds);
  return decodeAI(res[session.outputNames[0]], m, conf);
}

const autoPanel=document.getElementById('autoPanel'), autoMsg=document.getElementById('autoMsg');
const guess=document.getElementById('guess'), guessVal=document.getElementById('guessVal');
const SENS=4;   // 感度は固定（利用者に選ばせない）

/* 上に出ている帯の高さを測って、上に置いてあるものを下げる。
   帯は中身で高さが変わる（範囲指定の帯は説明文の分だけ背が高い）ので、
   固定値ではなく実測に合わせる。 */
/* 案内の帯を、下のバーのすぐ上に置く。
   以前は画面の上に固定し、本数バッジを押し下げていた。 */
/* 右上のボタンの幅を測って、本数バッジがそこへ食い込まないようにする。
   端末の幅や版の文字数で変わるので、固定値では合わない(2026-09-19)。 */
function fitTopRight(){
  const t=document.getElementById('topRight');
  if(t) document.documentElement.style.setProperty('--topright', t.offsetWidth+'px');
}

function fitTopBar(){
  // 横向きは左下（バーと同じ帯）、縦向きはバーの上
  const short=document.body.classList.contains('short');
  const y = short ? 8 : bar.offsetHeight+8;
  for(const id of ['eraseBanner','roiBanner']){
    const el=document.getElementById(id);
    if(el) el.style.bottom=y+'px';
  }
}

function placePanels(){
  const short=document.body.classList.contains('short');
  const b=bar.offsetHeight+8;

  /* 横向きは、下のバーのボタンを右へ寄せて左下を空けている。
     パネルはその**空いた左下**に、バーと同じ帯の高さで置く。
     縦向きは今までどおりバーの上に重ねる。 */
  const firstBtn=bar.querySelector('button');
  const panelBottom = short ? 8 : b;
  const panelMax = short
    ? Math.max(180, (firstBtn ? firstBtn.offsetLeft : bar.offsetWidth) - 16)
    : 0;
  document.documentElement.style.setProperty('--panelmax', panelMax ? panelMax+'px' : '');

  for(const el of [autoPanel, panel, roiGo, morePanel, statusPanel, savePanel, setPanel])
    el.style.bottom = panelBottom+'px';
  calcPanel.style.bottom = b+'px';           // 電卓は真ん中なのでバーの上
  hint.style.bottom = (short ? panelBottom : b+6)+'px';   // 横向きは左下の空きへ

  fitTopRight();
  fitTopBar();
  /* 画面の低い端末だと、パネルが本数バッジや右上のボタンに被る。
     上に置いてあるものの下から、下のバーまでの高さに収める。
     回している時 getBoundingClientRect は画面基準の外枠を返すので使えない。
     並びの位置(offsetTop/offsetHeight)は回転の影響を受けないのでこちらを使う。 */
  const below=el=>el.offsetTop+el.offsetHeight;
  const topEnd=Math.max(below(document.getElementById('topRight')), below(countBox)) + 8;
  /* アプリの高さ。下のバーは一番下に貼り付けてあるので、その下端がそのまま高さになる。
     innerWidth/innerHeight から出すと、回した直後の食い違いを拾ってしまう(2026-09-21) */
  const appH = bar.offsetHeight ? bar.offsetTop + bar.offsetHeight
                                : (land ? innerWidth : innerHeight);
  const room=Math.max(200, appH - panelBottom - topEnd);
  for(const el of [autoPanel, savePanel, panel, setPanel, morePanel, statusPanel])
    el.style.maxHeight=room+'px';
  /* 電卓だけは（真ん中に出すので）バーの上に置いている。
     入る高さもその分だけ低い。ここを他と同じ値にしていたため、
     電卓の上端が右上のボタンに被っていた(2026-09-19に修正)。 */
  /* 入る高さをそのまま使う。以前は最低180pxを確保していたが、
     入る高さがそれより狭い時に**上のボタンへ被る**原因になっていた(2026-09-21)。
     狭い時は電卓の中を送って見てもらう。 */
  const roomCalc=Math.max(120, appH - b - topEnd);
  calcPanel.style.maxHeight=roomCalc+'px';
  /* 横向きの電卓は、キーの段を入る高さいっぱいに広げる。
     そうしないと左側(式や履歴)の高さに引っ張られ、キーが横に長く潰れる。
     ここも入る高さを超えないようにする。 */
  const kb=document.getElementById('calcKeys');
  if(kb) kb.style.minHeight = short ? Math.max(100, roomCalc-46)+'px' : '';
}
guess.addEventListener('input',()=>{ guessVal.textContent=guess.value+'本'; });

/* 数え方を3つから選ぶ。

   もとは0.15〜0.40の数値ボタンを6つ並べていたが、モデルの精度が上がって
   この範囲ではほとんど結果が変わらなくなった(検証41枚で平均のズレは
   0.51〜0.54本、ぴったり当たるのは31〜34枚)。
   数字は使う人にとって意味が分かりにくいので、3つの言葉に置き換えた。

   値は実際に検証して選んである:
     多め   0.20 … 少し多めに出る(偏り +0.2本)
     ふつう 0.25 … 一番釣り合いが良い(偏り +0.1本、ぴったり34/41枚)
     少なめ 0.30 … 余分を減らす(偏り 0.0本) */
/* AIの厳しさ。以前は「多め/ふつう/少なめ」の3つから選べるようにしていたが、
   モデルの精度が上がり、0.20〜0.30のどれでも結果がほとんど変わらなくなった
   （検証41枚で平均のズレ0.4〜0.5本、ぴったり当たるのは同じ34枚）。
   選べても迷うだけなので、いちばん偏りの小さい0.25に固定した。 */
const CONF_FIXED=0.25;
let confValue=CONF_FIXED;

async function openAuto(){
  if(!img) return;
  autoPanel.classList.remove('hide'); placePanels(); draw();
  if(!aiReady){
    // 写真を読み込んだ時に始まっている場合があるので、終わるまで待ってから出し分ける
    autoMsg.textContent='AIモデルを準備しています…（初回のみ時間がかかります）';
    await loadAI();
  }
  document.getElementById('guessRow').classList.toggle('hide', aiReady);
  // 範囲を囲ったまま閉じて開き直した時に、囲っていることを忘れないよう出す
  const roiNote = roi ? '<b style="color:#7FDCEF">範囲を指定しています。</b>' : '';
  autoMsg.innerHTML = roiNote + (aiReady
    ? 'AIで数えます。「数える」を押してください。'
    : 'だいたいの本数を合わせて「数える」を押してください。'
      + (aiError ? `<br><span style="color:#FF8A5C;font-size:10px;word-break:break-all;line-height:1.5">AIが使えません／${aiError}</span>` : ''));
  placePanels();
}

/* 指定された本数に検出数が近づく木口の大きさを、二分探索で自動的に見つける（従来方式） */
function searchDetect(n){
  const w=gdata.w;
  let lo=w*0.008, hi=w*0.12, best=null;
  for(let i=0;i<7;i++){
    const R=(lo+hi)/2;
    const pk=detect(SENS,R);
    if(best===null || Math.abs(pk.length-n)<Math.abs(best.n-n)) best={pk,n:pk.length,R};
    if(pk.length>n) lo=R; else hi=R;
    if(pk.length===n) break;
  }
  return best;
}

/* 画面下に少しの間だけ出る知らせ。写真の邪魔をしないよう自動で消える */
let flashTimer=null;
/* 横長の写真をスマホの縦持ちで開くと、写真は画面の3分の1しか使えず、
   残り半分が真っ黒になる(実測: 812pxの画面で写真281px、空き395px)。
   横向きにすると写真が画面いっぱいになり、木口も3割大きく見える。
   土場の山は横長で撮るので、その時だけ一度知らせる。 */
function wideHint(){
  if(!img) return '';
  const 写真が横長 = img.width > img.height*1.15;
  const 画面が縦長 = !land && innerHeight > innerWidth;
  return (写真が横長 && 画面が縦長)
    ? 'スマホを<b>横向き</b>にすると、写真が大きく見えて確かめやすくなります' : '';
}

function flash(msg, ms=5000, caution){
  hint.innerHTML = caution
    ? '<span class="multi">'+msg+'<i>'+caution+'</i></span>'
    : '<span>'+msg+'</span>';
  hint.classList.remove('hide');
  hint.style.opacity=1;
  placePanels();                       // 下のバーの高さに合わせて位置を決める
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>hint.style.opacity=0, ms);
}

async function runAuto(){
  if(!img) return;
  if(marks.length && !confirm('今の印を消して数え直しますか？')) return;
  busy.textContent = aiReady ? 'AIが数えています…' : '自動で数えています…';
  busy.classList.remove('hide');
  await new Promise(r=>setTimeout(r,60));
  const t0=performance.now();
  try{
    let pts;
    if(aiReady){
      pts = await runAI(confValue);
    }else{
      if(!gdata) prepGray();
      const res=searchDetect(+guess.value);
      logR=res.R/gdata.sc;
      pts = res.pk.map(p=>({x:p.x/gdata.sc, y:p.y/gdata.sc}));
    }
    // 上の段から左→右の順に番号がつくよう並べ替え
    const rowH=img.height*0.05;
    pts.sort((a,b)=> Math.abs(a.y-b.y)>rowH ? a.y-b.y : a.x-b.x);
    marks=pts; aiCount=pts.length; addCount=0; delCount=0; logSpan=0; measureSpan(true);
    guide=false; updateCount();
    lastRoi=roi;   // 学習データ用に、どこを囲って数えたかを覚えておく
    roi=null; showRoiSet(false); showRoiGo(false);
    draw();
    // 数え終わったら写真を確かめたいので、パネルは畳んで写真を見せる
    closeAuto();
    flash(`<b style="color:var(--paint)">${marks.length}本</b> 検出（${((performance.now()-t0)/1000).toFixed(1)}秒）`+
      `　抜けはタップで追加、余分は「消す」で削除`,
      10000,
      'AIが数えた目安です。荷渡しの前に、必ずご自身の目で確かめてください');
    beep('ten');
  }catch(err){
    console.error(err);
    alert('自動カウントに失敗しました。手動で数えてください。');
  }finally{
    busy.classList.add('hide'); busy.textContent='写真を読み込み中…';
  }
}
const autoBtn=document.getElementById('auto');
/* 「自動」を閉じる時は、その中から開いた**範囲の帯と「この範囲で数える」も
   一緒に畳む**。以前は自動のパネルだけ消えて、範囲の帯が写真の上に
   残ってしまっていた(2026-09-20) */
function closeAuto(){
  autoPanel.classList.add('hide');
  autoBtn.classList.remove('on');
  if(roiMode) endRoi(false);
  showRoiGo(false);

}
/* 「見た目」と同じで、もう一度押せば閉じる。
   範囲を囲っている間も「自動」は点いたままなので、
   パネルが出ているかではなく**点いているか**で見る */
autoBtn.onclick=()=>{

/* ================= 範囲を指でタップして囲む =================
   1点ずつタップして角を置いていく方式。指を動かしても点を打つまでは
   写真の拡大・移動がそのまま使える（普段のピンチ・ドラッグと共存）。 */
const roiBanner=document.getElementById('roiBanner');
const roiMsgEl=document.getElementById('roiMsg');
const roiCountEl=document.getElementById('roiCount');
const roiUndoBtn=document.getElementById('roiUndo');
const roiFinishBtn=document.getElementById('roiFinish');

function updateRoiBanner(){
  const n=roiDraft.length;
  /* 横向きは帯を置ける幅が狭いので、長い案内文だと何行にも折り返して
     画面の半分を占めてしまう。短い言い方に切り替える(2026-09-19)。 */
  const short=document.body.classList.contains('short');
  roiCountEl.textContent = n===0 ? 'まだ0点'
    : (short ? `${n}点` : `${n}点　（3点以上で決定できます）`);
  roiMsgEl.textContent = short
    ? (n===0 ? '角をタップ' : (n<3 ? `あと${3-n}点` : '囲えます'))
    : (n===0 ? '写真の上を指でタップして、範囲の角を順番に囲んでください'
             : '続けてタップして角を足してください。指を動かせば拡大・移動もできます');
  roiUndoBtn.disabled = n===0;
  roiFinishBtn.disabled = n<3;
  fitTopBar();          // 説明文が変わると帯の高さも変わる
}
function startRoi(){
  roiMode=true; roiDraft=[];
  autoPanel.classList.add('hide');
  roiBanner.classList.remove('hide');
  fitTopBar();                             // 上の帯に被らないよう、上のものを下げる
  updateRoiBanner();
  draw();
}
function endRoi(backToPanel=true){
  roiMode=false; roiDraft=[];
  roiBanner.classList.add('hide');
  fitTopBar();
  if(backToPanel){ autoPanel.classList.remove('hide'); placePanels(); }
  draw();
}

/* 範囲を囲った後は、囲んだ形を確かめられるよう写真を隠さない。
   パネルの代わりに「数える」だけを下に細く出す。 */
/* 範囲が決まっている間は「範囲を囲う」は出さない。
   もう囲ってあるので押す意味がなく、「範囲を解除」と並ぶと紛らわしい(2026-09-20)。
   囲い直したい時は、いったん解除してから囲う */
function showRoiSet(on){
  document.getElementById('roiAll').classList.toggle('hide', !on);
  document.getElementById('roiBtn').classList.toggle('hide', on);
}
const roiGo=document.getElementById('roiGo');

}
document.getElementById('roiBtn').onclick=startRoi;
roiUndoBtn.onclick=()=>{ roiDraft.pop(); updateRoiBanner(); draw(); };
document.getElementById('roiCancel').onclick=()=>{
  autoMsg.textContent='範囲の指定をやめました。';
  showRoiGo(false);
  endRoi();
};
roiFinishBtn.onclick=()=>{
  if(roiDraft.length<3) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const p of roiDraft){ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }
  roi={points:roiDraft.slice(), x0,y0,x1,y1};
  showRoiSet(true);
  autoMsg.textContent='範囲を指定しました。';
  endRoi(false);          // パネルは出さない（囲んだ形が見えるように）
  /* 囲い終わったら写真ぜんぶを真ん中に出す。
     角を打つ時に拡大していると、囲った形の全体が見えないまま
     「この範囲で数える」を押すことになるため(2026-09-19)。 */
  fitView();
  showRoiGo(true);
  flash('囲んだ範囲を確かめてください', 6000);
};
document.getElementById('roiAll').onclick=()=>{
  roi=null; lastRoi=null; roiMode=false; roiDraft=[];
  showRoiSet(false);
  showRoiGo(false);
  autoMsg.textContent='範囲を解除しました。写真全体から数えます。'; draw();
};

document.getElementById('roiGoBtn').onclick=()=>{ showRoiGo(false); runAuto(); };
/* 囲み直す */
document.getElementById('roiRedo').onclick=()=>{

};

const savePanel=document.getElementById('savePanel');
const saveBtn=document.getElementById('save');
function closeSave(){ savePanel.classList.add('hide'); saveBtn.classList.remove('on'); }
saveBtn.onclick=()=>{
  if(!img) return;

  closePanels();
  const uchiwake = (aiCount!==null && (addCount||delCount))

    : '';

  savePanel.classList.remove('hide'); saveBtn.classList.add('on'); placePanels();

document.getElementById('savePng').onclick=()=>{
  if(!img) return;
  if(!confirm(`${marks.length}本として保存します。
本数に相違ありませんか？`)) return;
  closeSave();
  const c=document.createElement('canvas');
  c.width=img.width; c.height=img.height;
  const g=c.getContext('2d');
  g.drawImage(img,0,0);
  // 画面と同じ見え方で焼き込む(木口に合わせた大きさ)
  const r=Math.max(4, (logSpan>0 ? logSpan*0.45 : Math.max(img.width,img.height)*0.008)*markScale);
  const tc=textOn(markColor);
  marks.forEach((m,i)=>{
    g.beginPath(); g.arc(m.x,m.y,r,0,7);
    g.fillStyle=rgba(markColor,.42); g.fill();
    g.lineWidth=r*0.2; g.strokeStyle=markColor; g.stroke();
    if(showNums){
      g.font=`700 ${r*0.95}px Roboto, sans-serif`; g.textAlign='center'; g.textBaseline='middle';
      g.lineWidth=r*0.24;
      g.strokeStyle=tc==='#000000'?'rgba(255,255,255,.7)':'rgba(0,0,0,.65)';
      g.strokeText(i+1,m.x,m.y);
      g.fillStyle=tc; g.fillText(i+1,m.x,m.y);
    }
  });
  const fs=Math.max(28,img.width*0.045);
  g.font=`800 ${fs}px Roboto, sans-serif`; g.textAlign='left'; g.textBaseline='top';
  const label=`${marks.length} 本`;
  const w=g.measureText(label).width;
  g.fillStyle='rgba(30,22,16,.85)';
  g.fillRect(fs*0.4,fs*0.4,w+fs*0.8,fs*1.5);
  g.fillStyle=markColor; g.fillText(label,fs*0.8,fs*0.75);

  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const name=`genboku_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}_${marks.length}hon.png`;
  c.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  },'image/png');
};


/* ================= 学習データの書き出し =================
   写真（長辺1600pxのJPEG）とタップ位置を1つのファイルにまとめる。
   後でAIの学習データに使えるよう、座標は0〜1の比率でも持たせる。 */
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function downloadBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
document.getElementById('saveData').onclick=()=>{
  if(!img) return;
  if(!marks.length){ alert('印が1つもありません。数えてから保存してください。'); return; }
  const memo=prompt('メモ（現場名・荷主・樹種など／空欄でも可）','')||'';
  const maxSide=1600;
  const sc=Math.min(1,maxSide/Math.max(img.width,img.height));
  const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  const jpeg=c.toDataURL('image/jpeg',0.88).split(',')[1];
  const rec={
    format:'genboku-count/1',
    created:new Date().toISOString(),
    memo:memo,
    count:marks.length,
    image:{width:w,height:h,source_width:img.width,source_height:img.height},
    points:marks.map(m=>({
      x:+(m.x/img.width).toFixed(5), y:+(m.y/img.height).toFixed(5),   // 0〜1の比率
      px:Math.round(m.x*sc), py:Math.round(m.y*sc)                     // 保存画像での画素
    })),
    settings:{
      log_radius_ratio:+(logR/img.width).toFixed(4),
      mode: aiReady ? "ai" : "cv",
      conf: aiReady ? confValue : null,
      sens:SENS,
      guess:+guess.value,
      // 囲って数えた場合は、囲いの外に数えていない木口が残る。
      // 学習に使う時に切り抜けるよう、四角だけでなく指でなぞった形(points)も残す。
      roi: (roi||lastRoi) ? (r=>({
              x0:+(r.x0/img.width).toFixed(4),  y0:+(r.y0/img.height).toFixed(4),
              x1:+(r.x1/img.width).toFixed(4),  y1:+(r.y1/img.height).toFixed(4),
              points:(r.points||[]).map(p=>({x:+(p.x/img.width).toFixed(4),
                                             y:+(p.y/img.height).toFixed(4)}))
           }))(roi||lastRoi) : null
    },
    jpeg_base64:jpeg
  };
  const blob=new Blob([JSON.stringify(rec)],{type:'application/json'});
  downloadBlob(blob, `genboku_${stamp()}_${marks.length}hon.json`);
  closeSave();
  const mb=(blob.size/1048576).toFixed(1);
  setTimeout(()=>alert(`学習データを保存しました（約${mb}MB）。\n\nダウンロードフォルダに貯まります。定期的にパソコンやクラウドへ移してください。`),300);
};

/* ?reset を付けて開くと、保存庫を作り直す */
if(location.search.includes('reset')){
  (async()=>{
    try{
      const rs=await navigator.serviceWorker.getRegistrations();
      for(const r of rs) await r.unregister();
      for(const k of await caches.keys()) await caches.delete(k);
      alert('保存庫を消しました。もう一度開き直してください。');
    }catch(e){ alert('消せませんでした: '+e.message); }
  })();
}else if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.log('sw:',e));
  });
}

/* ================= 設定 =================
   下のバーはもう8個で2段あるので、ボタンは増やさず
   版バッジ(右上)を押すと開くようにしている。 */

/* 規約・ポリシー・連絡先が用意できたら true にする。
   false の間は「準備中」と出して、押せないようにしておく
   (公開していないページへ飛ばさないため)。
   pwa/privacy.html と pwa/terms.html の【　】を埋めて
   deploy_pwa.sh が公開したら、ここを true にすること。 */
const LEGAL_READY=false;
const CONTACT_MAIL='';        // 例 'genboku@example.com'

const setPanel=document.getElementById('setPanel');
const verBtn=document.getElementById('ver');

function closeSet(){ setPanel.classList.add('hide'); }

function drawLegal(){
  const box=document.getElementById('setLegal');
  const rows=[
    {href:'./terms.html',   label:'利用規約'},
    {href:'./privacy.html', label:'プライバシーポリシー'},

  for(const r of rows){

    const ready = LEGAL_READY && r.href;
    a.className='setLink'+(ready?'':' soon');
    a.textContent=r.label;
    if(ready){ a.href=r.href; a.target='_blank'; a.rel='noopener'; }
    box.appendChild(a);
  }
}

/* 版バッジ。**いまの状態だけ**を出す。
   規約類や「保存庫を作り直す」は「その他 → 設定」へ移した(2026-09-19)。 */
const statusPanel=document.getElementById('statusPanel');
function closeStatus(){ statusPanel.classList.add('hide'); verBtn.classList.remove('on'); }
verBtn.onclick=()=>{
  if(!statusPanel.classList.contains('hide')){ closeStatus(); return; }
  closePanels();
  document.getElementById('setVer').textContent=APP_VER;
  document.getElementById('setAI').textContent =
    aiReady ? '使えます' : (aiTried ? '使えません' : 'まだ読み込んでいません');
  document.getElementById('setConf').textContent = aiReady ? 'AIで数える' : '写真の明るさで数える';
  statusPanel.classList.remove('hide');
  verBtn.classList.add('on');
  placePanels();
};
/* 設定は「その他」から */
document.getElementById('openSet').onclick=()=>{
  closeMore();
  if(!setPanel.classList.contains('hide')){ closeSet(); return; }
  closePanels();
  drawLegal();
  setPanel.classList.remove('hide');
  placePanels();
};

/* 「前の版のまま」「AIが読めない」時の逃げ道。
   保存庫を空にして入れ直す。次に開く時だけ通信が要る。 */
document.getElementById('setReset').onclick=async ()=>{
  if(!confirm('保存庫を作り直しますか？\n\n次に開く時、AIの読み込みで通信が必要になります。\n写真や印は消えません。')) return;
  try{
    for(const k of await caches.keys()) await caches.delete(k);
    for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
  }catch(e){ console.log('reset:',e); }
  location.reload(true);
};

/* ================= 電卓 =================
   荷台を何回かに分けて数えた時に、その場で足せるようにするためのもの。
   開くと今の本数が入った状態で始まる。 */
const calcPanel=document.getElementById('calcPanel');
const calcBtn=document.getElementById('calcBtn');
const calcDisp=document.getElementById('calcDisp');
const calcExpr=document.getElementById('calcExpr');

/* 式は「数と記号の並び」で持つ。文字列で持つと⌫で記号を消せないため。
   例： ['48', '+', '52']  */
let toks=[];        // 打ち込んだ並び
let editing=false;  // 並びの最後の数をいま打っている最中か
let cAnswer=true;   // ＝の答えを出している最中か
let ansExpr='';     // ＝を押した時の式
let ansVal='0';     // ＝の答え

const OP_SIGN={'+':'＋','-':'−','*':'×','/':'÷'};
const isOp = t => t.length===1 && '+-*/'.includes(t);

/* 小数の誤差で 0.30000000000000004 のような表示にならないようにする */
function trim(n){
  if(!isFinite(n)) return 'エラー';
  return String(Math.round(n*1e9)/1e9);
}
function apply(a,op,b){
  switch(op){
    case '+': return a+b;
    case '-': return a-b;
    case '*': return a*b;
    case '/': return b===0 ? NaN : a/b;
  }
  return b;
}
/* 並びを左から順に計算する（電卓と同じで、掛け算を先にはしない）。
   末尾の記号は、まだ数が来ていないので無視する。 */
function evalToks(){
  const a=toks.slice();
  if(a.length && isOp(a[a.length-1])) a.pop();
  if(!a.length) return null;
  let acc=+a[0];
  for(let i=1;i+1<a.length;i+=2) acc=apply(acc, a[i], +a[i+1]);
  return acc;
}
function exprText(){
  return toks.map(t => isOp(t) ? OP_SIGN[t] : t).join(' ');
}

/* ＝を押すまでは、上に式・下に途中計算を小さく出す。
   ＝を押したら、その答えを大きく出す。 */
function calcShow(){
  if(cAnswer){
    calcExpr.innerHTML = ansExpr || '&nbsp;';
    calcDisp.textContent = ansVal;
    calcDisp.classList.add('answer');
  }else{
    calcExpr.innerHTML = exprText() || '&nbsp;';
    const v=evalToks();
    calcDisp.textContent = v===null ? '0' : trim(v);
    calcDisp.classList.remove('answer');
  }
  calcExpr.scrollLeft = calcExpr.scrollWidth;   // 長い式は右端（打った所）を見せる
}

function calcKey(k){
  const last = () => toks[toks.length-1];

  if(k==='C'){ toks=[]; editing=false; cAnswer=true; ansExpr=''; ansVal='0'; }

  else if(k==='back'){
    // 答えを出した後は、その答えを打ち直す形にしてから消す
    if(cAnswer){ toks=[ansVal]; editing=true; cAnswer=false; }
    if(toks.length){
      const t=last();
      if(!isOp(t) && t.length>1 && !(t.length===2 && t.startsWith('-'))){
        toks[toks.length-1]=t.slice(0,-1);
        editing=true;
      }else{
        toks.pop();                       // 記号も1つとして消える
        editing = toks.length>0 && !isOp(last());
      }
    }
  }

  else if(k==='.'){
    if(cAnswer){ toks=['0.']; editing=true; cAnswer=false; }
    else if(editing){ if(!last().includes('.')) toks[toks.length-1]+='.'; }
    else { toks.push('0.'); editing=true; }
  }

  else if('0123456789'.includes(k)){
    if(cAnswer){ toks=[k]; editing=true; cAnswer=false; }   // 答えの後に打つと新しい計算
    else if(editing){ toks[toks.length-1] = last()==='0' ? k : last()+k; }
    else { toks.push(k); editing=true; }
  }

  else if(k==='='){
    const v=evalToks();
    if(v!==null && toks.length>1){
      ansExpr=exprText().replace(/ [＋−×÷]$/,'');   // 末尾の記号は式から落とす
      ansVal=trim(v);
      pushHist(ansExpr, ansVal);
      toks=[ansVal]; editing=false; cAnswer=true;
    }
  }

  else{  // ＋−×÷
    if(cAnswer){ toks=[ansVal]; cAnswer=false; }
    if(!toks.length) toks.push('0');
    if(isOp(last())) toks[toks.length-1]=k;   // 記号の押し直しは差し替え
    else toks.push(k);
    editing=false;
  }
  calcShow();
}
document.getElementById('calcKeys').addEventListener('click', e=>{
  const b=e.target.closest('.ck');
  if(b) { calcKey(b.dataset.k); vib(8); }
});
/* ---- 履歴（30回分） ----
   計算した内容は端末に残るので、アプリを閉じても消えない。
   行を押すとその答えから計算を続けられる。 */
const HIST_MAX=30, HIST_KEY='genboku-calc-hist';
const histBtn=document.getElementById('calcHistBtn');
const histBox=document.getElementById('calcHist');
const keysBox=document.getElementById('calcKeys');
let calcHist=[];
try{ calcHist=JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch(e){ calcHist=[]; }

function saveHist(){
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(calcHist)); }catch(e){}
}
function pushHist(expr, result){
  calcHist.unshift({e:expr, r:result});
  if(calcHist.length>HIST_MAX) calcHist.length=HIST_MAX;
  saveHist();
  if(!histBox.classList.contains('hide')) drawHist();
}
function drawHist(){
  histBox.innerHTML='';
  if(!calcHist.length){
    histBox.innerHTML='<div class="empty">まだ計算していません</div>';
    return;
  }
  calcHist.forEach(h=>{
    const b=document.createElement('button');
    b.className='hrow';
    b.innerHTML=`<span class="he">${h.e} ＝</span><span class="hr">${h.r}</span>`;
    b.onclick=()=>{ toks=[h.r]; editing=false; cAnswer=true; ansExpr=h.e; ansVal=h.r; calcShow(); showKeys(); };
    histBox.appendChild(b);
  });
  const c=document.createElement('button');
  c.className='clear'; c.textContent='履歴を全部消す';
  c.onclick=()=>{
    if(!confirm('計算の履歴を全部消しますか？')) return;
    calcHist=[]; saveHist(); drawHist();
  };
  histBox.appendChild(c);
}
function showKeys(){
  histBox.classList.add('hide'); keysBox.classList.remove('hide');
  histBtn.classList.remove('on');
}
histBtn.onclick=()=>{
  if(histBox.classList.contains('hide')){
    drawHist();
    histBox.classList.remove('hide'); keysBox.classList.add('hide');
    histBtn.classList.add('on');
  }else showKeys();
};

function closeCalc(){ calcPanel.classList.add('hide'); calcBtn.classList.remove('on'); showKeys(); }
calcBtn.onclick=()=>{
  if(!calcPanel.classList.contains('hide')){ closeCalc(); return; }
  closePanels();
  // 打ち込んだ内容は写真を変えても残す（開き直しても消さない）
  calcShow();
  calcPanel.classList.remove('hide');
  calcBtn.classList.add('on');
  placePanels();
};

/* ================= パネル上部の摘み =================
   タップするか、下へ引き下げると閉じる。
   どのパネルも閉じ方は同じにしてある。 */
function bindGrab(panelEl, closeFn){
  const g=panelEl.querySelector('.grab');
  if(!g) return;
  let id=null, x0=0, y0=0, moved=0;
  /* 横向きは画面ごと90度回しているので、パネルの「下」は画面では「左」。
     画面の縦だけを見ていると、横向きで引き下げられない(2026-09-21) */
  const pulled = e => isLand() ? -(e.clientX-x0) : (e.clientY-y0);

  g.addEventListener('pointerdown', e=>{
    id=e.pointerId; x0=e.clientX; y0=e.clientY; moved=0;
    g.classList.add('hot');
    g.setPointerCapture(id);
    e.preventDefault();
  });

  g.addEventListener('pointermove', e=>{
    if(e.pointerId!==id) return;
    moved=pulled(e);
    // 下へ引いた分だけパネルも下がって、閉じる手応えが出る
    panelEl.style.transform = moved>0 ? `translateY(${moved}px)` : '';
    if(moved>70) g.classList.remove('hot');
  });

  function finish(e){
    if(e.pointerId!==id) return;
    id=null;
    g.classList.remove('hot');
    panelEl.style.transform='';
    // 指をほとんど動かさなければタップ、下へ70px以上引けば引き下げ
    if(Math.abs(moved)<8 || moved>70) closeFn();
  }
  g.addEventListener('pointerup', finish);
  g.addEventListener('pointercancel', finish);
}

bindGrab(autoPanel, closeAuto);
bindGrab(savePanel, closeSave);
bindGrab(panel, closeLook);
bindGrab(calcPanel, closeCalc);
bindGrab(setPanel, closeSet);
bindGrab(morePanel, closeMore);
bindGrab(statusPanel, closeStatus);

/* 前回の見た目を読み込んで、画面に反映する。
   ボタンや入力欄を作り終えた後でないと反映できないので、ここで行う。 */
loadPref();
(function applyPref(){
  [...swWrap.children].forEach(b=>
    b.setAttribute('aria-pressed', b.style.background===markColor || rgbToHex(b.style.background)===markColor));
  numEl.style.color=markColor;
  sizeInput.value=Math.round(markScale*100); drawPreview();
  togNum.classList.toggle('on',showNums);
  togNum.textContent=showNums?'番号を表示する':'番号を表示しない';
  togSnd.classList.toggle('on',soundOn);
  togSnd.textContent=soundOn?'タップ音を鳴らす':'タップ音を消す';
  togFit.classList.toggle('on',fitMark);
  togFit.textContent=fitMark?'木口に合わせる':'自分で決める';
})();
/* ブラウザが color を rgb() 形式で返すことがあるので、比べる前に揃える */
function rgbToHex(v){
  const m=/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/.exec(v||'');
  if(!m) return v;
  return '#'+[1,2,3].map(i=>(+m[i]).toString(16).padStart(2,'0')).join('').toUpperCase();
}

resize();
</script>
